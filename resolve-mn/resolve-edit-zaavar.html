<!DOCTYPE html>
<html lang="mn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0d141c">
<!-- ГАНЦ ФАЙЛЫН ХУВИЛБАР — tools/build-resolve-mn.mjs-ээр үүссэн. Гараар бүү зас.
     Эх код: resolve-mn/ хавтас. -->
<title>Edit хэрэгслийн мөр</title>
<meta name="description" content="DaVinci Resolve 21-ийн Edit хуудасны timeline-ийн хэрэгслийн мөр, viewer-ийн удирдлага: юу хийдэг, бичлэгт үзүүлэх нөлөө, алхам алхмаар заавар, хөтөч дээр туршдаг жишээ.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%E2%9C%82%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet" media="print" onload="this.media='all';this.onload=null">
<noscript><link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet"></noscript>
<style>
/* ── css/guide.css ── */
/* ═══════════════════════════════════════════════════════════
   Fusion хэрэгслийн мөрийн заавар
   Толь, загвартай нэг өнгө: бараан хөх ногоон суурь, гянт улбар шар
   (tungsten), өдрийн хөх (daylight). Зориуд ганц бараан загвар —
   Resolve өөрөө бараан тул.
   ═══════════════════════════════════════════════════════════ */
:root{
  color-scheme:dark;
  --ink:#0d141c; --panel:#141e29; --panel2:#18242f; --line:#25333f;
  --text:#e9eff5; --dim:#93a5b5; --dim2:#5d6f80;
  --tungsten:#f5a83c; --daylight:#6fb7dc;
  /* Resolve-ийн өөрийн саарал — хэрэгслийн мөрийн хуулбарт */
  --rs-bar:#28282e; --rs-bar2:#232328; --rs-edge:#0f0f11; --rs-icon:#b0b0b4; --rs-txt:#d4d4d6;
  /* Fusion-ий оролтын өнгө */
  --port-y:#e8c547; --port-g:#62c46a; --port-b:#4a8ee6;
  --disp:'Oswald','Arial Narrow',system-ui,sans-serif;
  --body:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;
  --mono:'JetBrains Mono',ui-monospace,Consolas,monospace;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:72px}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
body{margin:0;background:var(--ink);color:var(--text);font:15px/1.6 var(--body);-webkit-font-smoothing:antialiased}
a{color:var(--daylight);text-decoration:none}
a:hover{text-decoration:underline}
:focus-visible{outline:2px solid var(--daylight);outline-offset:2px}
h1,h2,h3{font-family:var(--disp);font-weight:600;text-wrap:balance;margin:0;line-height:1.15}
p{margin:0}
kbd{font:500 .82em var(--mono);border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:0 5px;background:var(--panel2);color:var(--text);white-space:nowrap}
b{font-weight:600;color:#fff}
img{max-width:100%}

#fz{padding-inline:clamp(16px,4vw,40px);padding-block:0 60px;max-width:1240px;margin:0 auto}

/* ── дээд цэс ── */
.fz-nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;display:flex;align-items:center;gap:16px;
  margin-inline:calc(clamp(16px,4vw,40px) * -1);padding:10px clamp(16px,4vw,40px);
  background:rgba(13,20,28,.93);border-bottom:1px solid var(--line);backdrop-filter:blur(8px)}
.fz-nav .brand{font:600 15px var(--disp);letter-spacing:.06em;text-transform:uppercase;color:var(--text);white-space:nowrap}
.fz-nav .brand b{color:var(--tungsten)}
.fz-nav .chips{display:flex;gap:4px;overflow-x:auto;flex:1;min-width:0;scrollbar-width:none}
.fz-nav .chips::-webkit-scrollbar{display:none}
.fz-nav .chips a,.fz-nav .out a{font-size:12.5px;color:var(--dim);padding:5px 8px;border-radius:6px;white-space:nowrap;border:1px solid transparent}
.fz-nav .chips a:hover,.fz-nav .out a:hover{color:var(--text);text-decoration:none;background:var(--panel2)}
.fz-nav .chips a.on{color:var(--tungsten);border-color:var(--line);background:var(--panel)}
.fz-nav .out{display:flex;gap:4px}
@media (max-width:640px){.fz-nav .out{display:none}.fz-nav{gap:10px}}

/* ── нүүр ── */
.eyebrow{font:500 11.5px var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--dim)}
.hero{padding-block:44px 28px;display:grid;gap:14px}
.hero h1{font-size:clamp(34px,6vw,60px);letter-spacing:.01em;text-transform:uppercase}
.lead{color:var(--dim);max-width:66ch;font-size:16px}
.lead b{color:var(--text)}

/* Resolve-ийн хэрэгслийн мөрийн хуулбар */
.tb-wrap{margin-top:12px;background:var(--rs-bar);border:1px solid var(--rs-edge);border-radius:6px;overflow:hidden;
  box-shadow:0 18px 40px rgba(0,0,0,.35)}
.tb-scroll{overflow-x:auto}
.tb{display:flex;align-items:center;justify-content:center;gap:2px;padding:9px 14px;min-width:max-content}
.tb-b{width:35px;height:34px;display:grid;place-items:center;color:var(--rs-icon);border-radius:4px}
.tb-b:hover,.tb-b:focus-visible{background:#3a3a42;color:#fff;text-decoration:none}
.tb-b svg{width:26px;height:22px;display:block}
.tb-div{width:1px;height:24px;background:#3a3a40;margin:0 6px;flex-shrink:0}
.tb-status{display:flex;justify-content:space-between;gap:16px;padding:6px 14px;background:var(--rs-bar2);border-top:1px solid var(--rs-edge);
  font-size:12.5px;color:#8e8e94}
.tb-hint.on{color:var(--rs-txt)}
.tb-mem{font-variant-numeric:tabular-nums;white-space:nowrap}

/* ── нод хэрхэн ажилладаг ── */
.basics{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:36px;padding-block:28px 40px;border-top:1px solid var(--line)}
.basics h2,.grp-h h2,.recipes h2{font-size:clamp(24px,3.4vw,34px);text-transform:uppercase;letter-spacing:.02em}
.basics-text{display:grid;gap:14px;align-content:start}
.basics-text>p{color:var(--dim);max-width:62ch}
.basics-list{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:20px 22px}
.basics-list h3{font-size:18px;margin-bottom:10px;letter-spacing:.02em}
.basics-list ol{margin:0;padding-left:20px;display:grid;gap:8px;color:var(--dim)}
@media (max-width:860px){.basics{grid-template-columns:1fr}}

.flow{display:flex;align-items:center;flex-wrap:wrap;gap:6px 8px;padding:18px;background:var(--rs-bar);border:1px solid var(--rs-edge);border-radius:6px;
  background-image:linear-gradient(#2f2f36 1px,transparent 1px),linear-gradient(90deg,#2f2f36 1px,transparent 1px);background-size:34px 34px}
.nd{display:inline-flex;align-items:center;min-height:28px;padding:3px 12px;background:#3c3c42;border:1px solid #4a4a50;border-radius:3px;
  font-size:12.5px;color:var(--rs-txt);white-space:nowrap}
.nd.sel{border-color:#e0433c;box-shadow:0 0 0 1px #e0433c}
.nd.src{border-left:3px solid var(--port-y)}
.nd.out{border-right:3px solid #fff}
.ar{color:var(--port-y);font-weight:600}
.ports{list-style:none;margin:0;padding:0;display:grid;gap:7px;color:var(--dim);font-size:14px}
.pt{display:inline-block;width:12px;height:12px;margin-right:8px;vertical-align:-1px;clip-path:polygon(0 0,100% 50%,0 100%)}
.pt.y{background:var(--port-y)} .pt.g{background:var(--port-g)} .pt.b{background:var(--port-b)}
.pt.o{background:#fff;clip-path:none;width:10px;height:10px}

/* ── бүлэг ── */
.grp{padding-top:30px;border-top:1px solid var(--line)}
.grp-h{display:grid;gap:10px;padding-bottom:6px}

/* ── хэрэгслийн карт ── */
.tool{padding-block:34px;border-bottom:1px dashed var(--line)}
.tool:last-child{border-bottom:0}
.tool-h{display:flex;gap:16px;align-items:center}
.tool-ic{width:58px;height:50px;flex-shrink:0;display:grid;place-items:center;background:var(--rs-bar);border:1px solid var(--rs-edge);border-radius:6px;color:#cfcfd3}
.tool-ic svg{width:36px;height:31px;display:block}
.tool-n{font:500 11px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--dim2)}
.tool-h h3{font-size:clamp(24px,3vw,30px);letter-spacing:.01em}
.tool-mn{color:var(--tungsten);font-size:14px}
.tool-tip{display:flex;flex-wrap:wrap;align-items:center;gap:8px 10px;margin-top:14px}
.tool-tip span{font:500 11px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--dim2)}
.tool-tip code{font:13px var(--body);color:var(--rs-txt);background:var(--rs-bar2);border:1px solid var(--rs-edge);border-radius:4px;padding:3px 10px}

.tool-body{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.08fr);gap:34px;margin-top:20px}
.tool-text{display:grid;gap:18px;align-content:start}
.tool-text h4{font:600 11.5px var(--body);letter-spacing:.12em;text-transform:uppercase;color:var(--dim);margin:0 0 6px}
.tool-text p,.tool-text li{color:#c6d2dd;max-width:64ch}
.tool-text ol,.tool-text ul{margin:0;padding-left:20px;display:grid;gap:5px}
.tool-text section.effect{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px 16px}
.tool-text section.effect h4{color:var(--tungsten)}
.params{display:grid;grid-template-columns:minmax(0,11.5rem) minmax(0,1fr);gap:6px 14px;margin:0}
.params dt{font:500 12.5px/1.5 var(--mono);color:var(--tungsten)}
.params dd{margin:0;color:#c6d2dd;font-size:14px}
.tips ul{list-style:none;padding-left:0}
.tips li{padding-left:18px;position:relative}
.tips li::before{content:"";position:absolute;left:2px;top:.62em;width:7px;height:7px;border:1.5px solid var(--daylight);transform:rotate(45deg)}
.unsure{font-size:13.5px;color:var(--dim)!important;border:1px dashed var(--line);border-radius:8px;padding:8px 12px}
.unsure b{color:var(--daylight)}
.tool-links{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:14px}
@media (max-width:920px){
  .tool-body{grid-template-columns:1fr}
  .tool-demo{order:-1}
  .params{grid-template-columns:1fr;gap:2px 0}
  .params dd{margin-bottom:6px}
}

/* ── жишээ ── */
.tool-demo{display:grid;gap:10px;align-content:start}
@media (min-width:921px){.tool-demo{position:sticky;top:70px;align-self:start}}
.stage{position:relative;aspect-ratio:16/9;max-width:100%;overflow:hidden;background:#000;border:1px solid var(--rs-edge);border-radius:6px;container-type:inline-size;isolation:isolate}
.stage.checker{background:conic-gradient(#2a2f36 25%,#1a1d22 0 50%,#2a2f36 0 75%,#1a1d22 0) 0 0/18px 18px}
.stage .ly{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.stage canvas.ly{image-rendering:auto}
.stage .defs{position:absolute;width:0;height:0}
.ab{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.seg{display:inline-flex;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:3px}
.seg button{font:500 13px var(--body);color:var(--dim);background:none;border:0;border-radius:6px;padding:5px 14px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--tungsten);color:#1a1206}
.ab-hint{font-size:12px;color:var(--dim2)}
.ctrls{display:grid;gap:8px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.crow{display:grid;grid-template-columns:minmax(0,10.5rem) minmax(0,1fr) 3.6rem;align-items:center;gap:10px}
.crow label{font:500 12px var(--mono);color:var(--dim)}
.crow output{font:500 12px var(--mono);color:var(--text);text-align:right;font-variant-numeric:tabular-nums}
.crow input[type=range]{width:100%;accent-color:var(--tungsten)}
.crow.sel{grid-template-columns:minmax(0,10.5rem) minmax(0,1fr)}
.crow select{font:13px var(--body);color:var(--text);background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:5px 8px;width:100%}
.crow.chk{grid-template-columns:auto minmax(0,1fr);gap:8px}
.crow.chk input{accent-color:var(--tungsten);width:16px;height:16px;margin:0}
.crow.chk label{color:var(--text)}
.crow.off{opacity:.45}
.btnrow{grid-template-columns:auto}
.cbtn{font:500 13px var(--body);color:var(--text);background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:6px 12px;cursor:pointer;justify-self:start}
.cbtn:hover{border-color:var(--tungsten);color:var(--tungsten)}
@media (max-width:520px){.crow{grid-template-columns:minmax(0,1fr) 3.4rem}.crow label{grid-column:1/-1}.crow.sel{grid-template-columns:1fr}}
.extra{display:flex;gap:14px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.extra p{font-size:13px;color:var(--dim)}
.fz-graph{width:112px;height:112px;flex-shrink:0}

/* жишээний давхаргууд */
.fz-title{display:flex;align-items:flex-end;justify-content:center;padding-bottom:10%}
.fz-title span{font-family:var(--disp);font-weight:600;color:#fff;line-height:1;white-space:nowrap}
.fz-fg{position:absolute;width:30%;height:auto;left:50%;top:50%;transform:translate(-50%,-50%)}
.fz-leak{background:linear-gradient(115deg,transparent 22%,rgba(255,140,40,.6) 44%,rgba(255,215,150,.22) 56%,transparent 72%);mix-blend-mode:screen}
.fz-outline{pointer-events:none}
.fz-outline path{stroke:var(--tungsten);stroke-width:2;vector-effect:non-scaling-stroke}
.fz-outline path.cmp{stroke:var(--daylight);stroke-dasharray:6 5}
.fz-outline rect{fill:var(--ink);stroke:var(--tungsten);stroke-width:1.5;vector-effect:non-scaling-stroke}
.fz-arrow{position:absolute;left:84%;top:18%;width:0;height:0}
.fz-arrow i{position:absolute;left:0;top:-1px;height:2px;background:var(--daylight);transform-origin:0 50%}
.fz-arrow i::after{content:"";position:absolute;right:-2px;top:-5px;border:6px solid transparent;border-left:9px solid var(--daylight);border-right:0}
.fz-arrow::before{content:"хүч";position:absolute;left:-14px;top:-26px;font:500 11px var(--mono);color:var(--daylight)}
.fz-arrow{transform-origin:0 0}

/* 3D */
.fz-3d{perspective:900px;perspective-origin:50% 38%;background:radial-gradient(ellipse at 50% 28%,#1c2432,#07090d 72%);overflow:hidden}
.fz-3d.plain{background:none}
.fz-floor{position:absolute;left:-60%;right:-60%;bottom:-8%;height:70%;transform:rotateX(80deg);transform-origin:50% 100%;
  background-image:linear-gradient(rgba(111,183,220,.2) 1px,transparent 1px),linear-gradient(90deg,rgba(111,183,220,.2) 1px,transparent 1px);background-size:5cqw 5cqw;
  -webkit-mask-image:linear-gradient(to top,#000 20%,transparent);mask-image:linear-gradient(to top,#000 20%,transparent)}
.fz-3d.plain .fz-floor{display:none}
.fz-world{position:absolute;inset:0;transform-style:preserve-3d}
.fz-plane{position:absolute;left:50%;top:50%;width:58%;height:auto;transform:translate(-50%,-50%);box-shadow:0 0 0 1px rgba(111,183,220,.35)}
.fz-plane.back{width:64%;transform:translate(-50%,-55%) translateZ(-200px)}
.fz-plane.back2{width:70%;transform:translate(-50%,-64%) translateZ(-260px)}
.fz-cube{position:absolute;left:50%;top:50%;width:var(--s);height:var(--s);transform-style:preserve-3d;--s:22cqw;transform:translate(-50%,-50%)}
.fz-cube .f{position:absolute;inset:0;background:#9aa2ac;filter:brightness(var(--l));border:1px solid rgba(0,0,0,.35);background-size:cover;background-position:center}
.fz-cube .front{transform:translateZ(calc(var(--s) / 2))}
.fz-cube .back{transform:rotateY(180deg) translateZ(calc(var(--s) / 2))}
.fz-cube .right{transform:rotateY(90deg) translateZ(calc(var(--s) / 2))}
.fz-cube .left{transform:rotateY(-90deg) translateZ(calc(var(--s) / 2))}
.fz-cube .top{transform:rotateX(90deg) translateZ(calc(var(--s) / 2))}
.fz-cube .bottom{transform:rotateX(-90deg) translateZ(calc(var(--s) / 2))}
.fz-cube.small{--s:11cqw;transform:translate(-50%,-50%) translate3d(13cqw,5cqw,40px) rotateY(32deg) rotateX(-16deg)}
.fz-cube.mid{--s:15cqw;transform:translate(-50%,-50%) translate3d(4cqw,7cqw,20px) rotateX(-14deg) rotateY(36deg)}
.fz-sphere{position:absolute;left:50%;top:50%;width:26cqw;aspect-ratio:1;border-radius:50%;transform:translate(-50%,-50%);
  background:radial-gradient(circle at 34% 30%,#f2f4f7,#8f969e 46%,#262a30 82%)}
.fz-sphere.tex{background:radial-gradient(circle at 34% 30%,rgba(255,255,255,.32),rgba(0,0,0,0) 46%,rgba(0,0,0,.78) 86%),var(--src);background-size:100% 100%,300% 100%}
.fz-t3d{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font:700 11cqw/1 var(--disp);letter-spacing:.02em;white-space:nowrap}
.fz-t3d.small{font-size:6cqw;color:#f3c768;transform:translate(-50%,-50%) translate3d(-12cqw,8cqw,90px)}
.fz-grp{position:absolute;inset:0;transform-style:preserve-3d}
.fz-shadow{position:absolute;left:50%;top:50%;width:24cqw;height:9cqw;border-radius:50%;background:radial-gradient(closest-side,rgba(0,0,0,.8),transparent);
  transform:translate(-40%,5cqw)}
.fz-3d.flat .f{filter:none}
.fz-3d.zpass{background:#000}
.fz-3d.zpass .fz-plane{filter:brightness(0) invert(.25);box-shadow:none}
.fz-3d.zpass .f{background:#e8e8e8;filter:brightness(calc(.8 + var(--l) * .2));border-color:#bbb}
.fz-3d.zpass .fz-floor{background-image:linear-gradient(to top,#d4d4d4,#000)}
.fz-cam{overflow:hidden;background:#000}
.fz-cam .fz-world{inset:0}
.fz-lay{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}

/* ── хамтын жишээ ── */
.recipes{padding-top:34px;border-top:1px solid var(--line);display:grid;gap:12px}
.rgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px;margin-top:10px}
.recipe{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:18px;display:grid;gap:12px;align-content:start}
.recipe h3{font-size:20px;letter-spacing:.02em}
.recipe .flow{padding:12px}
.recipe .side{list-style:none;margin:0;padding:0;font-size:14px;color:var(--dim)}
.recipe .why{color:var(--dim);font-size:14px}
.recipe ol{margin:0;padding-left:20px;display:grid;gap:4px;color:#c6d2dd;font-size:14px}
@media (max-width:860px){.rgrid{grid-template-columns:1fr}}

.fz-foot{margin-top:40px;padding-top:20px;border-top:1px solid var(--line);display:grid;gap:8px;color:var(--dim);font-size:13.5px;max-width:80ch}
.fz-foot b{color:var(--text)}

/* ═══════════════════════════════════════════════════════════
   Edit хуудасны заавар (edit-zaavar.html) — нэмэлт
   ═══════════════════════════════════════════════════════════ */
:root{--imp-edit:#f5a83c;--imp-image:#e0433c;--imp-audio:#62c46a;--imp-note:#b48cf0;--imp-view:#6fb7dc;--imp-protect:#c9ccd4}
.tool-h .impact{margin-left:auto;align-self:flex-start}
.impact{display:inline-block;font:500 11px var(--mono);letter-spacing:.04em;padding:3px 8px;border-radius:999px;border:1px solid currentColor;white-space:nowrap}
.impact.edit{color:var(--imp-edit)} .impact.image{color:var(--imp-image)} .impact.audio{color:var(--imp-audio)}
.impact.note{color:var(--imp-note)} .impact.view{color:var(--imp-view)} .impact.protect{color:var(--imp-protect)}
@media (max-width:640px){.tool-h{flex-wrap:wrap}.tool-h .impact{margin-left:74px}}
.imp-list{list-style:none;margin:0;padding:0;display:grid;gap:8px;font-size:14px;color:var(--dim)}
.imp-list li{display:grid;grid-template-columns:13.5rem minmax(0,1fr);gap:10px;align-items:start}

<main id="fz"></main>
<script>
/* ── js/00-core.js ── */
/* ═════════════════════════════════════════════════════════════
   DaVinci Resolve — Монгол хөтөч
   00 · Цөм: нэрийн орон зай, туслах функцууд
   ═════════════════════════════════════════════════════════════ */
(function (global) {
  "use strict";

  const RM = (global.RM = global.RM || {});

  RM.version = "1.0";

  /* ── DOM туслахууд ── */
  RM.$  = (sel, root) => (root || document).querySelector(sel);
  RM.$$ = (sel, root) => Array.prototype.slice.call((root || document).querySelectorAll(sel));

  RM.el = function (tag, attrs, kids) {
    const n = document.createElement(tag);
    if (attrs) {
      for (const k in attrs) {
        if (k === "class") n.className = attrs[k];
        else if (k === "text") n.textContent = attrs[k];
        else if (k === "html") n.innerHTML = attrs[k];
        else if (k.slice(0, 2) === "on") n.addEventListener(k.slice(2), attrs[k]);
        else if (attrs[k] != null && attrs[k] !== false) n.setAttribute(k, attrs[k]);
      }
    }
    if (kids) (Array.isArray(kids) ? kids : [kids]).forEach((k) => {
      if (k == null) return;
      n.appendChild(typeof k === "string" ? document.createTextNode(k) : k);
    });
    return n;
  };

  /* HTML-д аюулгүй болгох */
  RM.esc = function (s) {
    return String(s == null ? "" : s)
      .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;").replace(/'/g, "&#39;");
  };

  /* Хайлтын үрийг тодруулах */
  RM.mark = function (text, q) {
    const safe = RM.esc(text);
    if (!q) return safe;
    const needle = RM.esc(q).replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
    try {
      return safe.replace(new RegExp("(" + needle + ")", "gi"), "<mark>$1</mark>");
    } catch (e) { return safe; }
  };

  /* ── Гарын авлагын бичвэр → HTML (мини-markdown) ──
     хоосон мөр — догол;  ## — дэд гарчиг;  - / 1. — жагсаалт;  > — анхааруулга;
     **тод**;  [k:Ctrl+S] — товчлуур;  [[id]] / [[id|нэр]] — толины холбоос. */
  RM.md = function (src) {
    const xref = (id, label) => {
      const r = RM.dict && RM.dict.byId ? RM.dict.byId[id] : null;
      return '<a class="xref" href="#" data-id="' + id + '">' +
             (label != null ? label : (r ? RM.esc(r.en) : id)) + "</a>";
    };
    const inline = (s) => RM.esc(s)
      .replace(/\[k:((?:[^\]]|\](?=\]))+)\]/g, (m, k) => "<kbd>" + k + "</kbd>")
      .replace(/\[\[([a-z0-9-]+)\|([^\]]+)\]\]/g, (m, id, lb) => xref(id, lb))
      .replace(/\[\[([a-z0-9-]+)\]\]/g, (m, id) => xref(id))
      .replace(/\*\*(.+?)\*\*/g, "<b>$1</b>");

    const lines = String(src == null ? "" : src).replace(/\r/g, "").split("\n");
    let out = "", para = [], list = null, tag = "", note = [];
    const flushP = () => { if (para.length) { out += "<p>" + inline(para.join(" ")) + "</p>"; para = []; } };
    const flushL = () => { if (list) { out += "<" + tag + ">" + list.map((x) => "<li>" + inline(x) + "</li>").join("") + "</" + tag + ">"; list = null; } };
    const flushN = () => { if (note.length) { out += '<div class="note">' + inline(note.join(" ")) + "</div>"; note = []; } };
    const flush = () => { flushP(); flushL(); flushN(); };

    for (let i = 0; i < lines.length; i++) {
      const line = lines[i].trim();
      let m;
      if (!line) { flush(); continue; }
      if ((m = /^##\s+(.+)$/.exec(line)))       { flush(); out += "<h4>" + inline(m[1]) + "</h4>"; continue; }
      if ((m = /^[-•]\s+(.+)$/.exec(line)))     { flushP(); flushN(); if (!list || tag !== "ul") { flushL(); list = []; tag = "ul"; } list.push(m[1]); continue; }
      if ((m = /^\d+[.)]\s+(.+)$/.exec(line)))  { flushP(); flushN(); if (!list || tag !== "ol") { flushL(); list = []; tag = "ol"; } list.push(m[1]); continue; }
      if ((m = /^>\s?(.*)$/.exec(line)))        { flushP(); flushL(); note.push(m[1]); continue; }
      flushL(); flushN(); para.push(line);
    }
    flush();
    return '<div class="md">' + out + "</div>";
  };

  /* Кирилл/латин ялгаагүй жижигрүүлэлт */
  RM.norm = function (s) {
    return String(s == null ? "" : s).toLowerCase().replace(/ё/g, "е").trim();
  };

  /* Хугацаа хойшлуулагч (хайлтын оролтод) */
  RM.debounce = function (fn, ms) {
    let t = 0;
    return function () {
      const args = arguments, self = this;
      clearTimeout(t);
      t = setTimeout(() => fn.apply(self, args), ms || 120);
    };
  };

  /* Түр зуурын мэдэгдэл */
  RM.toast = function (msg) {
    let box = RM.$("#toast");
    if (!box) {
      box = RM.el("div", { id: "toast" });
      document.body.appendChild(box);
    }
    box.textContent = msg;
    box.classList.add("on");
    clearTimeout(RM.toast._t);
    RM.toast._t = setTimeout(() => box.classList.remove("on"), 1800);
  };

  /* Санах ойд хадгалах (localStorage аюулгүй) */
  RM.store = {
    get(key, fallback) {
      try {
        const v = localStorage.getItem("rm." + key);
        return v == null ? fallback : JSON.parse(v);
      } catch (e) { return fallback; }
    },
    set(key, val) {
      try { localStorage.setItem("rm." + key, JSON.stringify(val)); } catch (e) { /* үл хайхрах */ }
    },
    del(key) {
      try { localStorage.removeItem("rm." + key); } catch (e) { /* үл хайхрах */ }
    }
  };

  /* Хуулах */
  RM.copy = function (text) {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(
        () => RM.toast("Хуулагдлаа: " + text),
        () => RM.toast("Хуулж чадсангүй")
      );
      return;
    }
    const ta = RM.el("textarea", { style: "position:fixed;opacity:0" });
    ta.value = text;
    document.body.appendChild(ta);
    ta.select();
    try { document.execCommand("copy"); RM.toast("Хуулагдлаа: " + text); }
    catch (e) { RM.toast("Хуулж чадсангүй"); }
    ta.remove();
  };

})(window);

</script>
<script>
/* ── js/53-sim-icons.js ── */
/* ═════════════════════════════════════════════════════════════
   53 · Загварын дүрсүүд (SVG)

   Resolve Studio 21-ийн дэлгэцийн зурагнаас (2026-09-25) хэлбэр бүрийг
   нь дагаж гараар зурсан SVG. Blackmagic-ийн эх зургийг хуулаагүй —
   ижил хэлбэр, харьцаа, өнгөтэй шинээр зурсан.
   Үндсэн өнгө нь currentColor (товчны өнгө), бараан дэвсгэр нь тогтмол.
   ═════════════════════════════════════════════════════════════ */
(function (RM) {
  "use strict";

  const S = (RM.sim = RM.sim || {});
  const DK = "#26262a";     /* товчны доторх бараан дүүргэлт */

    "checker-board-wipe": svg(`<rect x="4" y="5" width="20" height="14" ${sw(1.2)}/>` + [0, 1, 2].map((r) => [0, 1, 2, 3, 4].map((c) => ((r + c) % 2 ? `<rect x="${4 + c * 4}" y="${5 + r * 4.67}" width="4" height="4.67" fill="currentColor" opacity=".6"/>` : "")).join("")).join("")),
    "jog-wheel": svg(`<path d="M7 8.5 3.5 12 7 15.5M21 8.5l3.5 3.5-3.5 3.5" ${sw(1.5)} stroke-linecap="round" stroke-linejoin="round"/><circle cx="14" cy="12" r="3.2" fill="currentColor"/>`)
  };

  /* Нэр → SVG; байхгүй бол тэмдэгт буцаана */
  S.icon = (key, fallback) => S.ICON[key] || fallback || "";
})(window.RM);

</script>
<script>
/* ── js/69-guide-ui.js ── */
/* ═════════════════════════════════════════════════════════════
   69 · Жишээтэй заавар — нийтлэг бүрэлдэхүүн (Fusion, Edit хоёр хуудас хамт хэрэглэнэ)

   G.ui.buildControls(tool, specs, onChange) — слайдер, жагсаалт, чагт, товч
   G.ui.buildDemo(tool, S, demos)            — жишээний самбар (Өмнө / Дараа)
   G.ui.buildTool(tool, S, cfg)              — хэрэгслийн карт
      cfg = { groups, total, demos, simPage, tipLabel, impacts }
   G.ui.watchNav(sectionSelector)           — одоо уншиж буй бүлгийг цэсэнд тодруулах
   ═════════════════════════════════════════════════════════════ */
(function (RM) {
  "use strict";

  const G = (RM.fz = RM.fz || {});
  const icon = (id) => (RM.sim && RM.sim.icon ? RM.sim.icon(id) : "");
  let cid = 0;

  function buildControls(tool, specs, onChange) {
    const el = G.el;
    const box = el("div", { class: "ctrls" });
    const v = {}, inputs = {};
    specs.forEach((sp) => {
      const id = "c-" + tool.id + "-" + sp.id + "-" + ++cid;
      if (sp.type === "button") {
        const b = el("button", { type: "button", class: "cbtn", id, text: sp.label, onclick: () => onChange(sp.id) });
        inputs[sp.id] = { inp: b, btn: true };
        box.appendChild(el("div", { class: "crow btnrow" }, [b]));
        return;
      }
      v[sp.id] = sp.value;
      if (sp.type === "range") {
        const out = el("output", { for: id });
        const show = () => { const n = +v[sp.id]; out.textContent = (sp.fmt ? sp.fmt(n) : (Math.abs(n) >= 10 || sp.step >= 1 ? n.toFixed(0) : n.toFixed(2))) + (sp.unit || ""); };
        const inp = el("input", { type: "range", id, min: sp.min, max: sp.max, step: sp.step, value: sp.value,
          oninput: (e) => { v[sp.id] = +e.target.value; show(); onChange(); } });
        show();
        inputs[sp.id] = { inp, show };
        box.appendChild(el("div", { class: "crow" }, [el("label", { for: id, text: sp.label }), inp, out]));
      } else if (sp.type === "select") {
        const sel = el("select", { id, onchange: (e) => { v[sp.id] = e.target.value; onChange(); } },
          sp.options.map(([val, lb]) => el("option", { value: val, text: lb, selected: val === sp.value ? "selected" : null })));
        inputs[sp.id] = { inp: sel };
        box.appendChild(el("div", { class: "crow sel" }, [el("label", { for: id, text: sp.label }), sel]));
      } else if (sp.type === "check") {
        const cb = el("input", { type: "checkbox", id, checked: sp.value ? "checked" : null, onchange: (e) => { v[sp.id] = e.target.checked; onChange(); } });
        inputs[sp.id] = { inp: cb };
        box.appendChild(el("div", { class: "crow chk" }, [cb, el("label", { for: id, text: sp.label })]));
      }
    });
    const ctl = {
      set(k, val) { v[k] = val; const i = inputs[k]; if (!i) return; if (i.inp.type === "checkbox") i.inp.checked = !!val; else i.inp.value = val; if (i.show) i.show(); },
      disable(k, on) { const i = inputs[k]; if (i) { i.inp.disabled = !!on; i.inp.closest(".crow").classList.toggle("off", !!on); } },
      label(k, text) { const i = inputs[k]; if (i && i.btn) i.inp.textContent = text; }
    };
    return { box, v, ctl };
  }

  function buildDemo(tool, S, demos) {
    const el = G.el;
    const def = demos[tool.demo];
    const wrap = el("div", { class: "tool-demo" });
    if (!def) return wrap;
    const stage = el("div", { class: "stage" + (def.checker ? " checker" : "") + (def.cls ? " " + def.cls : ""), role: "img", "aria-label": tool.en + " — хөтөч дээрх жишээ" });
    wrap.appendChild(stage);
    const st = def.init(stage, S, tool);
    let before = false;
    const run = (act) => def.update(c.v, before, st, c.ctl, act);
    const c = buildControls(tool, def.controls, run);
    if (!def.noAB) {
      const bBefore = el("button", { type: "button", "aria-pressed": "false", text: def.abLabels ? def.abLabels[0] : "Өмнө" });
      const bAfter = el("button", { type: "button", "aria-pressed": "true", text: def.abLabels ? def.abLabels[1] : "Дараа" });
      const setAB = (b) => { before = b; bBefore.setAttribute("aria-pressed", b); bAfter.setAttribute("aria-pressed", !b); run(); };
      bBefore.addEventListener("click", () => setAB(true));
      bAfter.addEventListener("click", () => setAB(false));
      wrap.appendChild(el("div", { class: "ab" }, [
        el("div", { class: "seg", role: "group", "aria-label": "Өмнө, дараа харьцуулах" }, [bBefore, bAfter]),
        el("span", { class: "ab-hint", text: def.hint || "Хөтөч дээрх ойролцоо дуурайлга" })
      ]));
    }
    if (def.controls.length) wrap.appendChild(c.box);
    if (def.extra) wrap.appendChild(el("div", { class: "extra" }, [def.extra(st), el("p", { text: def.extraText || "Муруй: хэвтээ — оролт, босоо — гаралт. Улаан, ногоон, цэнхэр — суваг бүр." })]));
    run();
    return wrap;
  }

  function buildTool(tool, S, cfg) {
    const el = G.el, fmt = G.fmt;
    const g = cfg.groups.find((x) => x.id === tool.group);
    const imp = tool.impact && cfg.impacts ? cfg.impacts[tool.impact] : null;
    const text = el("div", { class: "tool-text" }, [
      el("section", {}, [el("h4", { text: "Юу хийдэг" }), el("p", { html: fmt(tool.what) })]),
      el("section", { class: "effect" }, [el("h4", { text: "Бичлэгт үзүүлэх нөлөө" }), el("p", { html: fmt(tool.effect) })]),
      el("section", {}, [el("h4", { text: "Resolve дээр алхам алхмаар" }), el("ol", {}, tool.steps.map((s) => el("li", { html: fmt(s) })))]),
      el("section", {}, [el("h4", { text: "Гол тохиргоо" }),
        el("dl", { class: "params" }, tool.params.flatMap(([k, d]) => [el("dt", { html: fmt(k) }), el("dd", { html: fmt(d) })]))]),
      el("section", { class: "tips" }, [el("h4", { text: "Анхаарах" }), el("ul", {}, tool.tips.map((t) => el("li", { html: fmt(t) })))]),
      tool.unsure ? el("p", { class: "unsure", html: "<b>Баталгаажаагүй:</b> " + fmt(tool.unsure) }) : null,
      el("p", { class: "tool-links" }, [
        el("a", { href: "resolve-dotor.html#" + cfg.simPage + "." + (tool.simId || tool.id), text: "Загвар дээр харах →" }),
        el("a", { href: "resolve-toli.html#" + (tool.dictId || tool.id), text: "Толь, гарын авлага →" })
      ])
    ]);
    return el("article", { class: "tool", id: tool.id }, [
      el("header", { class: "tool-h" }, [
        el("span", { class: "tool-ic", html: icon(tool.iconId || tool.id) || '<span class="glyph">' + (tool.glyph || "•") + "</span>" }),
        el("div", {}, [
          el("p", { class: "tool-n", text: "№ " + tool.n + " / " + cfg.total + " · " + g.title }),
          el("h3", { text: tool.en }),
          el("p", { class: "tool-mn", text: tool.mn })
        ]),
        imp ? el("span", { class: "impact " + tool.impact, text: imp }) : null
      ]),
      el("p", { class: "tool-tip" }, [el("span", { text: cfg.tipLabel }), el("code", { text: tool.tip })]),
      el("div", { class: "tool-body" }, [text, buildDemo(tool, S, cfg.demos)])
    ]);
  }

  function watchNav(sel) {
    if (!("IntersectionObserver" in window)) return;
    const links = RM.$$(".fz-nav .chips a");
    const io = new IntersectionObserver((es) => es.forEach((e) => {
      if (!e.isIntersecting) return;
      links.forEach((a) => a.classList.toggle("on", a.getAttribute("href") === "#" + e.target.id));
    }), { rootMargin: "-40% 0px -55% 0px" });
    RM.$$(sel).forEach((s) => io.observe(s));
  }

  function jumpToHash() {
    const h = decodeURIComponent(location.hash.slice(1));
    if (h && document.getElementById(h)) requestAnimationFrame(() => document.getElementById(h).scrollIntoView());
  }


  /* ══════════ Хичээлийн горим — нэг удаад нэг хичээл (хэрэглэгчийн хүсэлтээр) ══════════
     Нүүр (#top): hero, үндэс, хичээлийн жагсаалт (#hicheel). #<id> — тэр хичээл л харагдана,
     доор нь «‹ Өмнөх · Дараах ›», дээр нь явцын зурвас. ← → товчоор шилжинэ. */
  function buildLessonsPage(c) {
    const el = G.el, fmt = G.fmt;
    const root = c.root;
    const firstOf = (gid) => c.tools.find((t) => t.group === gid);
    root.appendChild(el("nav", { class: "fz-nav", "aria-label": "Хичээлүүд" }, [
      el("a", { class: "brand", href: "#top" }, c.brand),
      el("div", { class: "chips" }, [el("a", { href: "#top", text: "Нүүр" })].concat(
        c.groups.map((g) => el("a", { href: "#" + firstOf(g.id).id, "data-group": g.id, text: g.title })),
        [el("a", { href: "#jishee", "data-group": "jishee", text: "Жишээ" })])),
      el("div", { class: "out" }, c.navOut)
    ]));

    /* нүүр */
    const toc = el("section", { class: "toc", id: "hicheel" }, [
      el("h2", { text: "Хичээлүүд" }),
      el("p", { class: "lead", html: fmt("Хичээл бүр **тусдаа хуудас**: юу хийдэг, бичлэгт үзүүлэх нөлөө, алхам алхмаар, туршдаг жишээ. Доод талын **Дараах ›** товчоор, эсвэл гарын [k:←] [k:→]-оор дараалан үзнэ.") })
    ].concat(c.groups.map((g, gi) => el("div", { class: "toc-g" }, [
      el("h3", {}, [el("span", { class: "toc-gn", text: String(gi + 1).padStart(2, "0") }), g.title, el("small", { text: g.en })]),
      el("div", { class: "toc-grid" }, c.tools.filter((t) => t.group === g.id).map((t) => el("a", { class: "toc-i", href: "#" + t.id }, [
        el("span", { class: "toc-ic", html: icon(t.iconId || t.id) || t.glyph || "•" }),
        el("span", { class: "toc-t" }, [el("small", { text: "№ " + t.n }), el("b", { text: t.en }), el("span", { text: t.mn })]),
        t.impact && c.impacts ? el("span", { class: "impact " + t.impact, text: c.impacts[t.impact] }) : null
      ])))
    ]))).concat([el("div", { class: "toc-g" }, [el("h3", {}, [el("span", { class: "toc-gn", text: "★" }), c.recipesTitle]),
      el("div", { class: "toc-grid" }, [el("a", { class: "toc-i", href: "#jishee" }, [el("span", { class: "toc-ic", text: "⛓" }),
        el("span", { class: "toc-t" }, [el("small", { text: "Сүүлийн хичээл" }), el("b", { text: c.recipesTitle }), el("span", { text: "Хэрэгслүүдийг дараалан хэрэглэх" })])])])])]));
    const intro = el("div", { class: "intro" }, [c.hero, c.basics, toc]);
    root.appendChild(intro);

    /* хичээлүүд */
    const lessons = c.tools.map((t) => ({ id: t.id, group: t.group, title: t.en, node: c.buildTool(t) }));
    lessons.push({ id: "jishee", group: "jishee", title: c.recipesTitle, node: c.recipes });
    const wrap = el("div", { class: "lessons" });
    lessons.forEach((L, i) => {
      const g = c.groups.find((x) => x.id === L.group);
      const first = g && firstOf(g.id).id === L.id;
      const sec = el("section", { class: "lesson", "aria-label": L.title, hidden: "hidden" }, [
        el("div", { class: "crumb" }, [
          el("a", { href: "#hicheel", text: "☰ Хичээлүүд" }),
          el("span", { text: "Хичээл " + (i + 1) + " / " + lessons.length + (g ? " · " + g.title : "") }),
          el("span", { class: "prog", "aria-hidden": "true" }, [el("i", { style: "width:" + ((i + 1) / lessons.length * 100).toFixed(1) + "%" })])
        ]),
        first ? el("div", { class: "grp-h lesson-grp" }, [
          el("p", { class: "eyebrow", text: "Бүлэг " + (c.groups.indexOf(g) + 1) + " / " + c.groups.length + " · " + g.en }),
          el("h2", { text: g.title }), el("p", { class: "lead", html: fmt(g.intro) })]) : null,
        L.node
      ]);
      const prev = lessons[i - 1], next = lessons[i + 1];
      const pg = (cls, href, small, big) => el("a", { class: "pg " + cls, href }, [el("small", { text: small }), el("span", { text: big })]);
      sec.appendChild(el("nav", { class: "pager", "aria-label": "Хичээл хооронд шилжих" }, [
        prev ? pg("prev", "#" + prev.id, "‹ Өмнөх", prev.title) : pg("prev", "#top", "‹ Буцах", "Нүүр"),
        el("a", { class: "pg toc-l", href: "#hicheel", text: "☰" , title: "Бүх хичээл", "aria-label": "Бүх хичээл" }),
        next ? pg("next", "#" + next.id, "Дараах ›", next.title) : pg("next", "#hicheel", "Дуусав ✓", "Хичээлийн жагсаалт")
      ]));
      L.el = sec;
      wrap.appendChild(sec);
    });
    root.appendChild(wrap);
    root.appendChild(c.footer);

    const idx = {}; lessons.forEach((L, i) => { idx[L.id] = i; });
    const chips = RM.$$(".fz-nav .chips a");
    const route = () => {
      const h = decodeURIComponent(location.hash.slice(1));
      const cur = Object.prototype.hasOwnProperty.call(idx, h) ? lessons[idx[h]] : null;
      intro.hidden = !!cur;
      lessons.forEach((L) => { L.el.hidden = L !== cur; });
      document.title = cur ? cur.title + " · " + c.baseTitle : c.baseTitle;
      chips.forEach((a) => a.classList.toggle("on", cur ? a.getAttribute("data-group") === cur.group : a.getAttribute("href") === "#top"));
      const on = RM.$(".fz-nav .chips a.on"); if (on && on.scrollIntoView) on.scrollIntoView({ block: "nearest", inline: "nearest" });
      const target = !cur && h && document.getElementById(h);
      if (target) target.scrollIntoView({ behavior: "instant" });
      else window.scrollTo({ top: 0, behavior: "instant" });
    };
    window.addEventListener("hashchange", route);
    document.addEventListener("keydown", (e) => {
      if (e.defaultPrevented || e.altKey || e.ctrlKey || e.metaKey || e.shiftKey) return;
      if (e.target && /^(INPUT|SELECT|TEXTAREA)$/.test(e.target.tagName)) return;
      const h = decodeURIComponent(location.hash.slice(1));
      if (!Object.prototype.hasOwnProperty.call(idx, h)) return;
      const i = idx[h];
      if (e.key === "ArrowRight" && lessons[i + 1]) location.hash = lessons[i + 1].id;
      else if (e.key === "ArrowLeft") location.hash = lessons[i - 1] ? lessons[i - 1].id : "top";
    });
    route();
  }

  G.ui = { buildControls, buildDemo, buildTool, watchNav, jumpToHash, buildLessonsPage };
})(window.RM);

</script>
<script>
/* ── js/74-ez-data.js ── */
/* ═════════════════════════════════════════════════════════════
   74 · Edit хуудасны заавар — агуулга

   Tooltip, товчны дараалал, цэсний мөр — хэрэглэгчийн Resolve Studio 21-ийн
   2026-09-26-ны дэлгэцийн зургаас. Үйлдлийн тайлбар — Blackmagic-ийн гарын
   авлага, Resolve-ийн түгээмэл ажиллагаанаас; баталгаажаагүйг "unsure"-д.

   impact — бичлэгт үзүүлэх нөлөөний төрөл (картын баруун дээд шошго):
     edit    — монтажийг (клипийн байрлал, урт, дараалал) өөрчилнө
     image   — дүрсийг (пиксел) өөрчилнө, эцсийн файлд орно
     audio   — timeline-д дуу нэмнэ
     note    — тэмдэглэл, эцсийн бичлэгт орохгүй

   ═════════════════════════════════════════════════════════════ */
(function (RM) {

  E.groups = [
    { id: "gorim", title: "Засварын горим", en: "Edit Modes",

    { id: "oruulah", title: "Клип оруулах", en: "Edit Actions",
      intro: "Source viewer-т нээсэн клипийг (эсвэл In/Out-оор тэмдэглэсэн хэсгийг) timeline-ийн **заагчийн байрлалд** оруулах гурван арга. Ялгаа нь: **хойшхи клипүүд юу болох вэ**." },
    { id: "tuslah", title: "Туслах унтраалга", en: "Snapping · Linked · Lock",
      intro: "Чирэх, сонгох, зөөх үйлдлийн **дүрмийг** өөрчилнө. Өөрсдөө бичлэгт юу ч хийхгүй — гэхдээ буруу байвал дуу зургаас салах, клип санамсаргүй хөдлөх зэрэг алдаа гарна." },
    { id: "temdeg", title: "Туг, тэмдэглэгээ, томруулалт", en: "Flags · Markers · Zoom",
      intro: "Timeline-ийн **зохион байгуулалт, харагдац**. Туг, тэмдэглэгээ — тэмдэглэл; томруулалт — timeline-ийг хэр ойроос харах. Эцсийн бичлэгт аль нь ч орохгүй." },
    { id: "haragdats", title: "Timeline-ийн харагдац, дуу бичлэг", en: "View Options · Voiceover",
      intro: "Хэрэгслийн мөрийн **зүүн гурван товч**: timeline-ийн харагдацын тохиргоо, түлхүүр кадрын тавиур, дуу бичих самбар." },
    { id: "viewer", title: "Viewer дээрх удирдлага", en: "Viewer Overlays · Jog Wheel",
      intro: "Viewer-ийн доод зүүн **▭ ⌄** жагсаалтаар viewer дээр ямар **бариул** гарахыг сонгоно. Бариулаар чирсэн бүхэн Inspector-ийн утгыг өөрчилж **дүрсэд нөлөөлнө** — Annotations-аас бусад. Жагсаалтын **Immersive** мөрийн үйлдэл баталгаажаагүй тул энд оруулаагүй." }
  ];

  E.tools = [
  /* ═════ 1. Засварын горим ═════ */
  { id: "selection-mode", n: 1, group: "gorim", en: "Selection Mode", mn: "Сонголтын горим", impact: "edit", demo: "selection",

<script>
/* ── js/71-fz-scene.js ── */
/* ═════════════════════════════════════════════════════════════
   71 · Fusion заавар — жишээний кадр ба туслах функцууд

   Жишээнд хэрэглэгчийн бичлэгтэй төстэй сансрын кадрыг (цагирагтай гариг,
   од, мананцар, цонхны төмөр) кодоор зурна. Давхарга тус бүрийг тусад нь
   хадгалдаг — 3D камерын жишээнд parallax хийхэд.
   ═════════════════════════════════════════════════════════════ */
(function (RM) {
  "use strict";

  const G = (RM.fz = RM.fz || {});
  const W = 640, H = 360;
  G.W = W; G.H = H;

  /* тогтмол санамсаргүй тоо — хуудас бүрд ижил кадр гарна */
  function prng(seed) {
    return function () {
      seed |= 0; seed = (seed + 0x6D2B79F5) | 0;
      let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;

  G.prng = prng;

  const canvas = (w, h) => { const c = document.createElement("canvas"); c.width = w || W; c.height = h || H; return c; };
  G.canvas = canvas;

  /* гаригийн байрлал — маск, гэрлийн жишээнд ч хэрэглэнэ */
  const P = { x: 420, y: 196, r: 104, tilt: -0.28 };
  G.planet = P;

  function drawBackground(ctx) {
    const g = ctx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, "#03050b"); g.addColorStop(1, "#0b1424");
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
    [[160, 90, 230, "rgba(96,70,170,.22)"], [520, 300, 260, "rgba(40,96,170,.20)"], [300, 260, 180, "rgba(170,80,120,.10)"]]
      .forEach(([x, y, r, c]) => {
        const n = ctx.createRadialGradient(x, y, 0, x, y, r);
        n.addColorStop(0, c); n.addColorStop(1, "rgba(0,0,0,0)");
        ctx.fillStyle = n; ctx.fillRect(0, 0, W, H);
      });
    const rnd = prng(7);
    for (let i = 0; i < 460; i++) {
      const x = rnd() * W, y = rnd() * H, r = 0.3 + rnd() * rnd() * 1.4, a = 0.35 + rnd() * 0.65;
      ctx.fillStyle = "rgba(235,240,255," + a.toFixed(2) + ")";
      ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill();
    }
    for (let i = 0; i < 9; i++) {
      const x = rnd() * W, y = rnd() * H, r = 5 + rnd() * 6;
      const s = ctx.createRadialGradient(x, y, 0, x, y, r);
      s.addColorStop(0, "rgba(255,255,255,.95)"); s.addColorStop(0.15, "rgba(200,220,255,.45)"); s.addColorStop(1, "rgba(200,220,255,0)");
      ctx.fillStyle = s; ctx.fillRect(x - r, y - r, r * 2, r * 2);

  function ring(ctx, front) {
    ctx.save();
    ctx.translate(P.x, P.y); ctx.rotate(P.tilt);
    if (front) { ctx.beginPath(); ctx.rect(-400, 0, 800, 300); ctx.clip(); }
    for (let i = 0; i < 16; i++) {
      const k = 1.34 + i * 0.045, a = [0.5, 0.35, 0.6, 0.2, 0.55, 0.45, 0.15, 0.5][i % 8];
      ctx.strokeStyle = "rgba(" + (215 - i * 3) + "," + (196 - i * 4) + "," + (158 - i * 5) + "," + a + ")";
      ctx.lineWidth = 3.2;
      ctx.beginPath(); ctx.ellipse(0, 0, P.r * k, P.r * k * 0.23, 0, 0, Math.PI * 2); ctx.stroke();
    }
    ctx.restore();
  }

  function drawPlanet(ctx) {
    ring(ctx, false);
    ctx.save();
    ctx.beginPath(); ctx.arc(P.x, P.y, P.r, 0, Math.PI * 2); ctx.clip();
    ctx.translate(P.x, P.y); ctx.rotate(P.tilt);
    const cols = ["#e3cfa3", "#cdb27f", "#b8955f", "#d8c08e", "#a98452", "#c7a877", "#e1ca98", "#9d7a4c"];
    const rnd = prng(3);
    for (let y = -P.r - 20; y < P.r + 20; y += 7 + rnd() * 9) {
      ctx.fillStyle = cols[Math.floor(rnd() * cols.length)];
      ctx.fillRect(-P.r - 30, y, P.r * 2 + 60, 18);
    }
    ctx.restore();
    ctx.save();
    const sh = ctx.createRadialGradient(P.x + P.r * 0.35, P.y - P.r * 0.4, P.r * 0.1, P.x, P.y, P.r * 1.05);
    sh.addColorStop(0, "rgba(255,245,220,.15)"); sh.addColorStop(0.55, "rgba(0,0,0,0)"); sh.addColorStop(1, "rgba(0,0,0,.88)");
    ctx.fillStyle = sh; ctx.beginPath(); ctx.arc(P.x, P.y, P.r, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = "rgba(255,230,190,.25)"; ctx.lineWidth = 1.5; ctx.stroke();
    ctx.restore();
    ring(ctx, true);
  }

  function drawStrut(ctx) {
    ctx.save();
    ctx.translate(-30, 40); ctx.rotate(0.62);
    const g = ctx.createLinearGradient(0, -40, 0, 40);
    g.addColorStop(0, "#2d323a"); g.addColorStop(0.5, "#1b1e24"); g.addColorStop(1, "#111317");
    ctx.fillStyle = g; ctx.fillRect(-60, -38, 520, 76);
    ctx.fillStyle = "rgba(170,200,230,.35)"; ctx.fillRect(-60, -38, 520, 2);
    ctx.fillStyle = "rgba(0,0,0,.5)"; ctx.fillRect(-60, 34, 520, 4);
    ctx.fillStyle = "#3a4048";
    for (let x = 0; x < 460; x += 46) { ctx.beginPath(); ctx.arc(x, -22, 2.6, 0, Math.PI * 2); ctx.arc(x, 22, 2.6, 0, Math.PI * 2); ctx.fill(); }
    ctx.restore();

    ctx.fillStyle = "rgba(170,200,230,.25)"; ctx.fillRect(0, H - 22, W, 1.5);
  }

  /* Paint-ийн жишээнд: зураас ба тоос */
  const SCRATCH = [[292, -6], [298, 60], [286, 130], [296, 205], [284, 270], [290, 366]];
  G.scratch = SCRATCH;
  function drawDamage(ctx) {
    ctx.save();
    ctx.strokeStyle = "rgba(240,244,250,.92)"; ctx.lineWidth = 5; ctx.lineCap = "round"; ctx.lineJoin = "round";
    ctx.beginPath(); SCRATCH.forEach(([x, y], i) => (i ? ctx.lineTo(x, y) : ctx.moveTo(x, y))); ctx.stroke();
    ctx.fillStyle = "rgba(235,238,245,.9)";
    [[260, 90, 4], [318, 170, 3], [275, 238, 5], [305, 300, 3]].forEach(([x, y, r]) => { ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill(); });
    ctx.restore();
  }

  /* Merge-ийн жишээнд: тунгалаг дэвсгэртэй лого */
  function drawLogo() {
    const c = canvas(220, 220), ctx = c.getContext("2d");
    ctx.fillStyle = "rgba(245,168,60,.96)";
    ctx.beginPath(); ctx.arc(110, 110, 92, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = "#1a1206"; ctx.lineWidth = 6;
    ctx.beginPath(); ctx.arc(110, 110, 74, 0, Math.PI * 2); ctx.stroke();
    ctx.fillStyle = "#1a1206"; ctx.textAlign = "center"; ctx.textBaseline = "middle";
    ctx.font = "700 58px Oswald, 'Arial Narrow', sans-serif"; ctx.fillText("1ST", 110, 100);
    ctx.font = "600 20px Inter, Arial, sans-serif"; ctx.fillText("STUDIO", 110, 146);
    return c.toDataURL("image/png");
  }

  G.build = function () {
    if (G.scene) return G.scene;
    const bg = canvas(), planet = canvas(), strut = canvas(), full = canvas(), dirty = canvas();
    drawBackground(bg.getContext("2d"));
    drawPlanet(planet.getContext("2d"));
    drawStrut(strut.getContext("2d"));
    const f = full.getContext("2d");
    f.drawImage(bg, 0, 0); f.drawImage(planet, 0, 0); f.drawImage(strut, 0, 0);
    const d = dirty.getContext("2d");
    d.drawImage(full, 0, 0); drawDamage(d);
    const url = (c) => c.toDataURL("image/jpeg", 0.9);
    G.scene = {
      full, dirty,
      src: url(full), dirtySrc: url(dirty),
      bgSrc: url(bg), planetSrc: planet.toDataURL("image/png"), strutSrc: strut.toDataURL("image/png"),
      logoSrc: drawLogo()
    };

  };

  /* ── жижиг туслахууд ── */
  G.el = function (tag, attrs, kids) {

      if (k === "class") n.className = v;
      else if (k === "text") n.textContent = v;
      else if (k === "html") n.innerHTML = v;
      else if (k === "style") n.style.cssText = v;
      else if (k.slice(0, 2) === "on") n.addEventListener(k.slice(2), v);
      else n.setAttribute(k, v);
    }
    (kids || []).forEach((k) => k != null && n.appendChild(typeof k === "string" ? document.createTextNode(k) : k));
    return n;
  };

  G.fmt = function (s) {
    const esc = String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");

  G.maskURL = function (drawShape, soft, invert) {
    const c = canvas(W / 2, H / 2), ctx = c.getContext("2d");
    ctx.save(); ctx.scale(0.5, 0.5);
    ctx.fillStyle = "#fff";
    if (soft > 0.3) {
      /* shadowOffset, shadowBlur нь canvas-ийн пикселээр (scale-д үл хамаарна) — хагас хэмжээтэй тул */
      ctx.shadowColor = "#fff"; ctx.shadowBlur = soft; ctx.shadowOffsetX = W * 1.5;
      ctx.translate(-W * 3, 0);

    ctx.beginPath(); drawShape(ctx); ctx.fill();
    ctx.restore();

      const c2 = canvas(W / 2, H / 2), x = c2.getContext("2d");

  };

  G.whenVisible = function (node, onChange) {

<script>
/* ── js/75-ez-demos.js ── */
/* ═════════════════════════════════════════════════════════════
   75 · Edit хуудасны заавар — хөтөч дээрх жишээнүүд

   Timeline-ийн жишээнд жижиг timeline зурна: V1, A1 (заримд A2) зам,
   A · B · C клип, заагч. Клип бүрийн дотор эх бичлэгийн аль хэсэг
   харагдаж байгааг (эх: 2.0–8.0 с) бичнэ — slip, roll-ийн ялгаа харагдана.
   Viewer-ийн жишээнд 71-ийн сансрын кадрыг ашиглана.

   Бүтэц: E.demos[нэр] = { controls, init(stage, S, tool) → st, update(v, before, st, ctl, act),
                           noAB?, abLabels?, hint? }
   ═════════════════════════════════════════════════════════════ */
(function (RM) {
  "use strict";

  const E = RM.ez, G = RM.fz, el = G.el, W = G.W, H = G.H, P = G.planet;
  const D = (E.demos = {});

  const R = (id, label, min, max, step, value, unit, fmt) => ({ id, label, type: "range", min, max, step, value, unit, fmt });
  const SEL = (id, label, options, value) => ({ id, label, type: "select", options, value });
  const CHK = (id, label, value) => ({ id, label, type: "check", value });
  const BTN = (id, label) => ({ id, label, type: "button" });
  const sec = (n) => n.toFixed(1);
  const FPS = 24;

  /* ══════════ Timeline-ийн жижиг загвар ══════════ */
  const HUE = { A: 208, B: 28, C: 152, S: 285, "B1": 28, "B2": 28, VO: 0 };
  const copy = (arr) => arr.map((c) => Object.assign({}, c));

  function tlInit(stage, S, tracks) {
    stage.classList.add("ez-stage");
    const root = el("div", { class: "ez-tl" });
    const ruler = el("div", { class: "ez-ru" });
    const rows = el("div", { class: "ez-rows" });
    const ph = el("div", { class: "ez-ph" });
    const info = el("div", { class: "ez-info", "aria-live": "polite" });
    const lanes = {};
    (tracks || ["V1", "A1"]).forEach((id) => {
      const lane = el("div", { class: "ez-lane" });
      lanes[id] = lane;
      rows.appendChild(el("div", { class: "ez-row " + (id[0] === "V" ? "v" : "a") }, [el("span", { class: "ez-hd", text: id }), lane]));
    });
    const phWrap = el("div", { class: "ez-phwrap" }, [ph]);
    root.appendChild(ruler); root.appendChild(rows); root.appendChild(phWrap); root.appendChild(info);
    stage.appendChild(root);
    return { root, ruler, lanes, ph, info, src: S.src, phWrap };
  }

  /* model = { T, t0?, ph, tracks: {V1:[clip], A1:[clip]}, ghosts: {V1:[{s,d}]}, marks:[{t,color,where}], snap, msg, opts } */
  function tlRender(st, m) {
    const T0 = m.t0 || 0, T = m.T, span = T - T0;
    const pct = (t) => ((t - T0) / span * 100);
    const o = m.opts || {};
    /* шугам */
    const step = span > 40 ? 10 : span > 12 ? 2 : span > 5 ? 1 : 0.5;
    let rh = "";
    for (let t = Math.ceil(T0 / step) * step; t <= T + 1e-6; t += step) rh += '<span style="left:' + pct(t) + '%">' + (step < 1 ? t.toFixed(1) : t.toFixed(0)) + "</span>";
    (m.marks || []).filter((k) => k.where === "timeline").forEach((k) => { rh += '<i class="ez-mk" style="left:' + pct(k.t) + "%;--mc:" + k.color + '"></i>'; });
    st.ruler.innerHTML = rh;
    /* зам бүр */
    for (const id in st.lanes) {
      const lane = st.lanes[id], clips = (m.tracks[id] || []).slice().sort((a, b) => a.s - b.s);
      let h = "";
      /* хоосон зай — видео замд, клипүүдийн хооронд */
      if (id[0] === "V" && !o.noGaps) {
        let end = 0;
        clips.forEach((c) => { if (c.s - end > 0.05 && end > 0) h += '<div class="ez-gap" style="left:' + pct(end) + "%;width:" + (pct(c.s) - pct(end)) + '%"></div>'; end = Math.max(end, c.s + c.d); });
      }
      ((m.ghosts || {})[id] || []).forEach((g) => { h += '<div class="ez-ghost" style="left:' + pct(g.s) + "%;width:" + (pct(g.s + g.d) - pct(g.s)) + '%"></div>'; });
      clips.forEach((c) => {
        if (c.s + c.d < T0 || c.s > T) return;
        const left = pct(c.s), w = pct(c.s + c.d) - left;
        const hue = c.hue != null ? c.hue : (HUE[c.n] != null ? HUE[c.n] : 200);
        const cls = "ez-clip " + (id[0] === "V" ? "v" : "a") + (c.chg ? " chg" : "") + (c.rec ? " rec" : "") + (c.cut ? " cut" : "") + (c.shake ? " shake" : "");
        const srcTxt = o.durs === false ? "" : (o.srcLabel !== false ? "эх " + sec(c.i) + "–" + sec(c.i + c.d) : sec(c.d) + " с");
        const name = o.names === false ? "" : c.label || c.n;
        let style = "left:" + left + "%;width:" + w + "%;--h:" + hue + ";--i:" + c.i + ";";
        if (c.op != null) style += "--op:" + c.op + ";";
        let inner = "";
        if (id[0] === "V") {
          const th = o.thumb || "film";
          inner = '<span class="ez-img ' + th + '" style="background-image:url(' + st.src + ')"></span>';
        } else {
          inner = o.wave === false ? "" : '<span class="ez-wave" style=\'background-image:' + (o.nonrect === false ? WAVE.uni : WAVE.bi) + '\'></span>';
        }
        const badge = c.off ? '<b class="ez-off">' + (c.off > 0 ? "+" : "") + c.off + "</b>" : "";
        const flag = c.flag ? '<i class="ez-flag" style="--fc:' + c.flag + '"></i>' : "";
        const cm = (m.marks || []).filter((k) => k.where === "clip" && k.clip === c.n).map((k) => '<i class="ez-cmk" style="left:' + ((k.t - c.s) / c.d * 100) + "%;--mc:" + k.color + '"></i>').join("");
        h += '<div class="' + cls + '" style="' + style + '">' + inner + badge + flag + cm +
             '<span class="ez-cn"><b>' + name + "</b>" + (srcTxt ? "<small>" + srcTxt + "</small>" : "") + "</span></div>";
      });
      if (m.snap != null && id === Object.keys(st.lanes)[0]) h += '<div class="ez-snap" style="left:' + pct(m.snap) + '%"></div>';
      lane.innerHTML = h;
    }
    /* заагч */
    st.ph.style.left = pct(m.ph) + "%";
    st.ph.hidden = m.ph == null || m.ph < T0 || m.ph > T;
    st.info.innerHTML = "<span>" + (m.msg || "") + "</span>";
  }

  /* Дууны долгионы зураг — нэг удаа үүсгэнэ (хоёр талт ба нэг талт) */
  const WAVE = (() => {
    const r = G.prng(11); let bi = "", uni = "";
    for (let x = 0; x < 120; x++) {
      const a = Math.max(0.08, Math.min(1, 0.25 + 0.55 * Math.abs(Math.sin(x / 7)) * (0.5 + r()) + (r() < 0.08 ? 0.3 : 0)));
      bi += '<rect x="' + x + '" y="' + (20 - a * 18).toFixed(1) + '" width=".7" height="' + (a * 36).toFixed(1) + '"/>';
      uni += '<rect x="' + x + '" y="' + (40 - a * 38).toFixed(1) + '" width=".7" height="' + (a * 38).toFixed(1) + '"/>';
    }
    const url = (body) => 'url("data:image/svg+xml,' + encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 40" preserveAspectRatio="none" width="120" height="40"><g fill="#fff">' + body + "</g></svg>") + '")';
    return { bi: url(bi), uni: url(uni) };
  })();

  const endOf = (clips) => clips.reduce((e, c) => Math.max(e, c.s + c.d), 0);
  const lenMsg = (clips, base) => {
    const L = endOf(clips), dl = L - base;
    return "Timeline-ийн урт: <b>" + sec(L) + " с</b>" + (Math.abs(dl) > 0.05 ? ' <span class="' + (dl > 0 ? "up" : "dn") + '">(' + (dl > 0 ? "+" : "") + sec(dl) + ")</span>" : " (хэвээр)");
  };
  const BASE = () => [{ n: "A", s: 0, d: 5, i: 1 }, { n: "B", s: 5, d: 6, i: 2 }, { n: "C", s: 11, d: 5, i: 0.5 }];

  /* Нэг клипийг [a, b] хэсгээр дарж бичих (хасах) */
  function carve(clips, a, b) {
    const out = [];
    clips.forEach((c) => {
      const cs = c.s, ce = c.s + c.d;
      if (ce <= a + 1e-6 || cs >= b - 1e-6) { out.push(c); return; }
      if (cs < a) out.push(Object.assign({}, c, { d: a - cs, chg: true }));
      if (ce > b) out.push(Object.assign({}, c, { s: b, d: ce - b, i: c.i + (b - cs), chg: true }));
    });
    return out;
  }
  /* t цэгт клипийг хоёр хуваах */
  function split(clips, t, tag) {
    const out = [];
    clips.forEach((c) => {
      if (t > c.s + 0.05 && t < c.s + c.d - 0.05) {
        out.push(Object.assign({}, c, { d: t - c.s, label: c.n + "1", cut: tag }));
        out.push(Object.assign({}, c, { s: t, d: c.s + c.d - t, i: c.i + (t - c.s), label: c.n + "2", cut: tag }));
      } else out.push(c);

    return out;
  }
  const both = (v, a) => ({ V1: v, A1: a || copy(v) });

  /* ═════ 1. Selection Mode ═════ */
  D.selection = {
    controls: [SEL("act", "Хулганаар", [["move", "B-г голоос нь чирж зөөх"], ["trim", "B-ийн баруун ирмэгийг чирэх"]], "move"),
               R("amt", "Хэр хол", 0, 3, 0.1, 2, " с")],
    init: (stage, S) => tlInit(stage, S),
    update(v, before, st) {
      let c = BASE(); const base = endOf(c);
      let msg = "Өмнө: A · B · C хоорондоо зайгүй. " + lenMsg(c, base);
      const ghosts = {};
      if (!before) {
        const B = c[1];
        ghosts.V1 = [{ s: B.s, d: B.d }];
        if (v.act === "move") {
          const ns = B.s + v.amt, others = carve([c[0], c[2]], ns, ns + B.d);
          c = others.concat([Object.assign({}, B, { s: ns, chg: true })]);
          msg = "B " + sec(v.amt) + " с зөөгдөж, ард нь <b>хоосон зай</b> үлдэв; C-ийн эхний " + sec(v.amt) + " с <b>дарагдав</b>. " + lenMsg(c, base);
        } else {
          c[1] = Object.assign({}, B, { d: B.d - v.amt, chg: true });
          msg = "B богиносож <b>" + sec(v.amt) + " с хоосон зай</b> үлдэв — C хөдөлсөнгүй. " + lenMsg(c, base);

  /* ═════ 2. Trim Edit Mode — ripple, roll, slip, slide ═════ */

    const c = BASE(); const [A, B, C] = c;

    else if (type === "roll") { B.d += amt; C.s += amt; C.d -= amt; C.i += amt; B.chg = C.chg = true; }
    else if (type === "slip") { B.i += amt; B.chg = true; }
    else if (type === "slide") { A.d += amt; B.s += amt; C.s += amt; C.d -= amt; C.i += amt; A.chg = B.chg = C.chg = true; }
    return c;
  }
  const TRIM_TXT = {

    slide: "B хөршүүдийн хооронд зөөгдөв: A уртсаж C богиносов, B-ийн агуулга хэвээр."

  D.trim = {

               R("amt", "Чирэх зай", -2, 2, 0.1, 1.5, " с")],
    init: (stage, S) => tlInit(stage, S),
    update(v, before, st) {
      const base = endOf(BASE());
      const c = before ? BASE() : trimModel(v.type, v.amt);
      tlRender(st, { T: 20, ph: 8, tracks: both(c), msg: (before ? "Өмнө. " : TRIM_TXT[v.type] + " ") + lenMsg(c, base) });
    }
  };

  /* ═════ 3. Blade ═════ */
  D.blade = {
    controls: [R("ph", "Заагч (хэрчих газар)", 1, 15, 0.1, 8, " с"), CHK("link", "Linked Selection асаалттай", true)],
    init: (stage, S) => tlInit(stage, S),
    update(v, before, st) {
      const c = BASE();

    }
  };

  /* ═════ 4. Dynamic Trim (Slip) ═════ */
  D.dyntrim = {
    controls: [SEL("mode", "Дэд горим", [["slip", "Slip (зурагт)"], ["slide", "Slide"]], "slip"),
               R("amt", "J ◀ · K ■ · L ▶ тоглуулсан", -2, 2, 0.1, 1, " с", (n) => (n < 0 ? "J " : n > 0 ? "L " : "K ") + Math.abs(n).toFixed(1))],
    init: (stage, S) => tlInit(stage, S),
    update(v, before, st) {
      const c = before ? BASE() : trimModel(v.mode, v.amt);
      const key = v.amt < 0 ? "J — хойш" : v.amt > 0 ? "L — урагш" : "K — зогсоосон";
      tlRender(st, { T: 20, ph: 8, tracks: both(c), msg: before ? "Өмнө." : "<b>" + key + "</b> " + sec(Math.abs(v.amt)) + " с тоглуулаад K-оор зогсоов → " + TRIM_TXT[v.mode] });
    }
  };

  /* ═════ 5–7. Insert / Overwrite / Replace ═════ */
  const SRC = { n: "S", d: 3, i: 4, hue: HUE.S, label: "S (Source)" };
  const editCtl = [R("ph", "Timeline-ийн заагч", 1, 15, 0.1, 8, " с")];
  D.insert = {
    controls: editCtl,
    init: (stage, S) => tlInit(stage, S),
    update(v, before, st) {
      let c = BASE(); const base = endOf(c);
      let msg = "Source viewer-т <b>S</b> (3 с) бэлэн. Заагч " + sec(v.ph) + " с дээр.";
      if (!before) {
        c = split(c, v.ph).map((k) => (k.s >= v.ph - 1e-6 ? Object.assign({}, k, { s: k.s + SRC.d, chg: true }) : k));
        c.push(Object.assign({}, SRC, { s: v.ph, chg: true }));
        msg = "S шигтгэгдэж, заагчаас хойшхи бүх клип <b>3 с баруун тийш</b> түлхэгдэв. Юу ч устсангүй. " + lenMsg(c, base);
      }
      tlRender(st, { T: 22, ph: v.ph, tracks: both(c), msg });
    }
  };
  D.overwrite = {
    controls: editCtl,
    init: (stage, S) => tlInit(stage, S),
    update(v, before, st) {
      let c = BASE(); const base = endOf(c);
      let msg = "Source viewer-т <b>S</b> (3 с) бэлэн. Заагч " + sec(v.ph) + " с дээр.";
      if (!before) {
        c = carve(c, v.ph, v.ph + SRC.d);
        c.push(Object.assign({}, SRC, { s: v.ph, chg: true }));
        msg = "S доорх " + sec(SRC.d) + " с-ийг <b>дарж бичив</b> — бусад клип хөдөлсөнгүй. " + lenMsg(c, base);
      }

  };
  D.replace = {
    controls: editCtl,
    init: (stage, S) => tlInit(stage, S),
    update(v, before, st) {

      const k = c.findIndex((x) => v.ph >= x.s && v.ph < x.s + x.d);

         gap < 0 && gap > -0.8 ? "C нь B-ийн сүүлийн <b>" + Math.round(-gap * FPS) + " кадрыг</b> дарав." : "C " + sec(s) + " с-т.");

  /* ═════ 11–12. Flag, Marker ═════ */
  const COLORS = [["#2f7ff5", "Blue"], ["#27cfd8", "Cyan"], ["#2fc24a", "Green"], ["#f0a232", "Yellow"], ["#e8392f", "Red"], ["#f040b8", "Pink"],
    ["#9a3cf0", "Purple"], ["#e2346c", "Fuchsia"], ["#f39ab8", "Rose"], ["#a79cf0", "Lavender"], ["#8fd6f4", "Sky"], ["#72d46a", "Mint"],
    ["#e6e45a", "Lemon"], ["#e8a66c", "Sand"], ["#9a6b52", "Cocoa"], ["#f4efe4", "Cream"]];

  D.flag = {

    init(stage, S) { const st = tlInit(stage, S); return st; },

      const c = [{ n: "A", s: 0, d: 4, i: 1, label: "A (1-р хэсэг)" }, { n: "B", s: 4, d: 6, i: 2 }, { n: "A", s: 10, d: 5, i: 8, label: "A (2-р хэсэг)" }];

        msg: before ? "Туггүй." : "A клипэд <b>" + name + "</b> туг — timeline дахь <b>хоёр хэсэгт хоёуланд</b> нь гарав (туг эх клипэд хамаардаг)." + (v.smart ? " Smart Bin-ээр шүүвэл зөвхөн A." : "") });
    }

  D.marker = {
    controls: [colorSel("c", "#2f7ff5"), SEL("where", "Хаана", [["timeline", "Timeline-ийн шугам дээр (клип сонгоогүй)"], ["clip", "B клип дээр (клип сонгосон)"]], "timeline"),
               R("t", "Кадар", 5.2, 10.8, 0.1, 7.5, " с"), CHK("mv", "Дараа нь B-г 3 с зөөх", false)],

      tlRender(st, { T: 20, ph: v.t, tracks: both(c), marks, opts: { srcLabel: false }, msg });
    }
  };

  /* ═════ 13–15. Томруулалт ═════ */
  const LONG = (() => { const r = G.prng(7), out = []; let t = 0, k = 0; while (t < 58) { const d = 1.5 + r() * 5; out.push({ n: String.fromCharCode(65 + (k % 26)), s: t, d: Math.min(d, 60 - t), i: r() * 5, hue: (k * 47) % 360 }); t += d; k++; } return out; })();
  function zoomDemo(mode) {
    return {
      noAB: true,
      controls: [SEL("mode", "Горим", [["full", "Full Extent Zoom"], ["detail", "Detail Zoom"], ["custom", "Custom Zoom"]], mode),
                 R("z", "Custom · гүйлгэгч (− ● +)", 1, 12, 0.1, 3, "×"), R("ph", "Заагч", 0, 60, 0.1, 31, " с")],

        const vis = LONG.filter((c) => c.s + c.d > t0 && c.s < T).length;

          "Цонхонд <b>" + sec(w) + " с</b> (" + Math.round(w * FPS) + " кадр), " + vis + " клип. " + (v.mode === "full" ? "Бүх 60 с." : v.mode === "detail" ? "Заагчийн орчим — кадраар засахад." : "Гүйлгэгчээр тохируулсан хэмжээ.") + " Бичлэг өөрчлөгдөхгүй." });

  /* ═════ 16. Timeline View Options ═════ */
  D.tvo = {
    noAB: true,
    controls: [CHK("wave", "Display Audio Waveforms", true), CHK("names", "Display Clip Names", true), CHK("durs", "Display Clip Durations", true),
               CHK("nonrect", "Display Non-Rectified Waveforms", true),
               SEL("thumb", "Thumbnail View ›", [["film", "Filmstrip"], ["ends", "Эхэн, төгсгөлийн зураг"], ["simple", "Зураггүй"]], "film"),
               R("vh", "Track Height · Video", 26, 60, 1, 44, "%"), R("ah", "Track Height · Audio", 20, 56, 1, 38, "%")],
    init: (stage, S) => tlInit(stage, S),
    update(v, before, st) {

        msg: "Зөвхөн <b>харагдац</b> өөрчлөгдөв — бичлэг, дуу, урт хэвээр (16.0 с)." });
    }
  };

  /* ═════ 17. Баталгаажаагүй (Show Keyframe Tray) ═════ */
  D.unknown = {

    init(stage) {

      stage.appendChild(el("div", { class: "ez-q" }, [el("b", { text: "?" }), el("p", { text: "Энэ товчийг дарсны дараах дэлгэцийн зургийг илгээнэ үү — таамаглалгүйгээр жишээ хийнэ." })]));
      return {};
    },
    update() {}
  };

  /* ═════ 18. Voiceover ═════ */
  D.voiceover = {
    noAB: true,
    controls: [BTN("rec", "● Бичих"), R("ph", "Заагч (эхлэх газар)", 0, 10, 0.1, 3, " с")],
    init(stage, S) { const st = tlInit(stage, S, ["V1", "A1", "A2"]); st.takes = []; st.rec = null; return st; },
    update(v, before, st, ctl, act) {
      const draw = () => {

        if (st.rec) a2.push({ n: "VO", s: st.rec.s, d: st.rec.d, i: 0, hue: 0, rec: true, label: "● REC" });
        tlRender(st, { T: 20, ph: st.rec ? st.rec.s + st.rec.d : v.ph, tracks: { V1: BASE(), A1: BASE(), A2: a2 }, opts: { srcLabel: false },
          msg: st.rec ? "Бичиж байна… " + sec(st.rec.d) + " с — дахин дарж зогсооно." :
            st.takes.length ? "A2 замд <b>" + st.takes.length + " бичлэг</b> нэмэгдэв — эцсийн бичлэгт орно. Видео хөндөгдсөнгүй." : "Бичих товч → ярих → дахин дарж зогсоо." });
      };
      if (act === "rec") {
        if (st.rec) { clearInterval(st.timer); st.takes.push({ s: st.rec.s, d: Math.max(0.4, st.rec.d) }); st.rec = null; ctl.label("rec", "● Бичих"); }
        else {
          st.rec = { s: v.ph, d: 0 }; ctl.label("rec", "■ Зогсоох");
          st.timer = setInterval(() => { if (!st.rec) return; st.rec.d = Math.min(20 - st.rec.s, st.rec.d + 0.25); draw(); if (st.rec.s + st.rec.d >= 20) { clearInterval(st.timer); st.takes.push(st.rec); st.rec = null; ctl.label("rec", "● Бичих"); draw(); } }, 125);
        }
      }
      draw();
    }
  };

  /* ══════════ Viewer-ийн жишээнүүд ══════════ */
  const img = (src, cls) => el("img", { src, class: "ly " + (cls || ""), alt: "", draggable: "false" });
  const pctX = (x) => (x / W * 100) + "%", pctY = (y) => (y / H * 100) + "%";

  /* ═════ 19. Transform ═════ */
  D.transform = {
    controls: [R("z", "Zoom", 0.4, 2, 0.01, 1.35), R("x", "Position X", -320, 320, 1, -90), R("y", "Position Y", -180, 180, 1, 20),
               R("r", "Rotation Angle", -45, 45, 0.5, 0, "°"), CHK("ovl", "Viewer ▭ ⌄ → Transform (бариул)", true)],
    init(stage, S) {
      stage.classList.add("ez-black");
      const i = img(S.src); stage.appendChild(i);
      const box = el("div", { class: "ez-box" }, ["tl", "tr", "bl", "br", "t", "b", "l", "r"].map((k) => el("i", { class: k })).concat([el("b")]));
      stage.appendChild(box);
      return { i, box };
    },
    update(v, before, st) {
      const tf = before ? "none" : "translate(" + (v.x / W * 100) + "%," + (v.y / H * 100) + "%) rotate(" + v.r + "deg) scale(" + v.z + ")";
      st.i.style.transform = tf; st.box.style.transform = tf;
      st.box.hidden = before || !v.ovl;
    }
  };

  /* ═════ 20. Crop ═════ */
  D.crop = {
    controls: [R("l", "Crop Left", 0, 300, 1, 40), R("r", "Crop Right", 0, 300, 1, 0), R("t", "Crop Top", 0, 170, 1, 46), R("b", "Crop Bottom", 0, 170, 1, 46),
               R("soft", "Softness", 0, 30, 0.5, 0), CHK("ovl", "Viewer ▭ ⌄ → Crop (бариул)", true)],
    checker: true,
    init(stage, S) {
      const i = img(S.src); stage.appendChild(i);
      const box = el("div", { class: "ez-box crop" }, ["t", "b", "l", "r"].map((k) => el("i", { class: k })));
      stage.appendChild(box);
      return { i, box };
    },
    update(v, before, st) {
      if (before) { st.i.style.webkitMaskImage = st.i.style.maskImage = "none"; st.box.hidden = true; return; }
      const x0 = v.l, y0 = v.t, x1 = W - v.r, y1 = H - v.b;
      G.setMask(st.i, G.maskURL((c) => c.rect(x0, y0, Math.max(1, x1 - x0), Math.max(1, y1 - y0)), v.soft));
      Object.assign(st.box.style, { left: pctX(x0), top: pctY(y0), width: pctX(x1 - x0), height: pctY(y1 - y0) });
      st.box.hidden = !v.ovl;
    }
  };

  /* ═════ 21. Dynamic Zoom ═════ */
  const EASE = { lin: (t) => t, in: (t) => t * t, out: (t) => 1 - (1 - t) * (1 - t), io: (t) => (t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2) };
  D.dynzoom = {
    controls: [R("t", "Клипийн явц", 0, 1, 0.01, 0.6, "", (n) => Math.round(n * 100) + "%"),
               SEL("ease", "Ease", [["lin", "Linear"], ["in", "Ease In"], ["out", "Ease Out"], ["io", "Ease In and Out"]], "io"),
               CHK("swap", "Swap (эхлэл, төгсгөл солих)", false), BTN("play", "▶ Тоглуулах")],
    init(stage, S) {
      stage.classList.add("ez-black");
      const i = img(S.src); stage.appendChild(i);
      const mini = el("div", { class: "ez-mini" }, [img(S.src), el("i", { class: "g" }), el("i", { class: "r" }), el("i", { class: "c" })]);
      stage.appendChild(mini);
      return { i, mini };
    },
    update(v, before, st, ctl, act) {
      if (act === "play" && !st.anim) {
        const t0 = performance.now();
        const step = (now) => { const t = Math.min(1, (now - t0) / 3000); ctl.set("t", t); this.update(Object.assign({}, v, { t }), before, st, ctl); if (t < 1) st.anim = requestAnimationFrame(step); else st.anim = null; };
        if (G.reduced) ctl.set("t", 1); else st.anim = requestAnimationFrame(step);
      }
      const S0 = { x: 0, y: 0, w: W, h: H }, E1 = { w: W * 0.5, h: H * 0.5 };
      E1.x = Math.min(W - E1.w, Math.max(0, P.x - E1.w / 2)); E1.y = Math.min(H - E1.h, Math.max(0, P.y - E1.h / 2));
      const [a, b] = v.swap ? [E1, S0] : [S0, E1];
      const k = EASE[v.ease](v.t);
      const cur = { x: a.x + (b.x - a.x) * k, y: a.y + (b.y - a.y) * k, w: a.w + (b.w - a.w) * k, h: a.h + (b.h - a.h) * k };
      const sc = W / cur.w;
      st.i.style.transformOrigin = "0 0";
      st.i.style.transform = before ? "none" : "scale(" + sc + ") translate(" + (-cur.x / W * 100) + "%," + (-cur.y / H * 100) + "%)";
      const put = (n, r) => Object.assign(n.style, { left: pctX(r.x), top: pctY(r.y), width: pctX(r.w), height: pctY(r.h) });
      const [g, r, c] = st.mini.querySelectorAll("i");
      put(g, a); put(r, b); put(c, cur);
      st.mini.hidden = before;
    }
  };

  /* ═════ 22. Open FX Overlay — гэрлийн толбо ═════ */
  D.ofx = {
    controls: [R("x", "Center X", 0, W, 1, 470), R("y", "Center Y", 0, H, 1, 70), R("br", "Brightness", 0, 1.5, 0.01, 1), CHK("ovl", "Viewer ▭ ⌄ → Open FX Overlay", true)],
    init(stage, S) {
      stage.appendChild(img(S.src));
      const fl = el("div", { class: "ly ez-flare" }); stage.appendChild(fl);
      const h = el("div", { class: "ez-handle" }); stage.appendChild(h);
      return { fl, h };
    },
    update(v, before, st) {
      const x = v.x / W * 100, y = v.y / H * 100;
      st.fl.style.background = "radial-gradient(circle at " + x + "% " + y + "%, rgba(255,240,210," + 0.95 * v.br + ") 0, rgba(255,190,110," + 0.45 * v.br + ") 5%, rgba(255,150,60," + 0.12 * v.br + ") 16%, transparent 34%)," +
        "linear-gradient(" + (y - 50) * 0.3 + "deg, transparent " + (y - 1) + "%, rgba(255,210,160," + 0.28 * v.br + ") " + y + "%, transparent " + (y + 1) + "%)";
      st.fl.hidden = before;
      Object.assign(st.h.style, { left: x + "%", top: y + "%" });
      st.h.hidden = before || !v.ovl;
    }
  };

  /* ═════ 23. Fusion Overlay — Fusion гарчиг ═════ */
  D.fusionovl = {
    controls: [R("x", "Center X", 0.1, 0.9, 0.005, 0.32), R("y", "Center Y", 0.1, 0.9, 0.005, 0.78), R("s", "Size", 0.5, 2, 0.01, 1), CHK("ovl", "Viewer ▭ ⌄ → Fusion Overlay", true)],
    init(stage, S) {
      stage.appendChild(img(S.src));
      const t = el("div", { class: "ez-title" }, [el("span", { text: "ЭЭЖИЙН ДУУ" })]); stage.appendChild(t);
      const h = el("div", { class: "ez-fh" }); stage.appendChild(h);
      return { t, h };
    },
    update(v, before, st) {
      Object.assign(st.t.style, { left: v.x * 100 + "%", top: v.y * 100 + "%", fontSize: 6.2 * v.s + "cqw" });
      Object.assign(st.h.style, { left: v.x * 100 + "%", top: v.y * 100 + "%" });
      st.t.hidden = before; st.h.hidden = before || !v.ovl;
    }
  };

  /* ═════ 24. Annotations — хулганаар зурах ═════ */
  D.annotations = {
    abLabels: ["Deliver (эцсийн файл)", "Viewer (засвар)"], hint: "Кадар дээр хулганаар зураарай",
    controls: [SEL("tool", "Хэрэгсэл", [["pen", "Чөлөөт шугам"], ["arrow", "Сум"]], "arrow"),
               SEL("col", "Өнгө", [["#ff4d3d", "Улаан"], ["#ffd23d", "Шар"], ["#3dd6ff", "Цэнхэр"], ["#ffffff", "Цагаан"]], "#ff4d3d"), BTN("clr", "Цэвэрлэх")],
    init(stage, S) {
      stage.appendChild(img(S.src));
      const c = G.canvas(W * 2, H * 2); c.className = "ly ez-draw"; stage.appendChild(c);
      const tag = el("span", { class: "ez-tag", text: "◆ Marker — Annotation" }); stage.appendChild(tag);
      const st = { c, ctx: c.getContext("2d"), strokes: [], tag, v: null };
      /* эхний жишээ сум */
      st.strokes.push({ tool: "arrow", col: "#ff4d3d", pts: [[180, 80], [335, 170]] });
      const pos = (e) => { const r = c.getBoundingClientRect(); return [(e.clientX - r.left) / r.width * W, (e.clientY - r.top) / r.height * H]; };
      let cur = null;
      c.addEventListener("pointerdown", (e) => { if (c.hidden) return; c.setPointerCapture(e.pointerId); cur = { tool: st.v.tool, col: st.v.col, pts: [pos(e)] }; st.strokes.push(cur); e.preventDefault(); });
      c.addEventListener("pointermove", (e) => { if (!cur) return; const p = pos(e); if (cur.tool === "arrow") cur.pts[1] = p; else cur.pts.push(p); paint(st); });
      c.addEventListener("pointerup", () => { cur = null; });
      c.addEventListener("pointercancel", () => { cur = null; });
      return st;
    },
    update(v, before, st, ctl, act) {
      st.v = v;
      if (act === "clr") st.strokes = [];
      st.c.hidden = before; st.tag.hidden = before;
      paint(st);
    }
  };
  function paint(st) {
    const x = st.ctx; x.setTransform(2, 0, 0, 2, 0, 0); x.clearRect(0, 0, W, H);
    x.lineCap = x.lineJoin = "round"; x.lineWidth = 3.5;
    st.strokes.forEach((s) => {
      x.strokeStyle = x.fillStyle = s.col; x.beginPath();
      if (s.tool === "arrow") {
        if (s.pts.length < 2) return;
        const [[x0, y0], [x1, y1]] = s.pts, a = Math.atan2(y1 - y0, x1 - x0);
        x.moveTo(x0, y0); x.lineTo(x1, y1); x.stroke();
        x.beginPath(); x.moveTo(x1, y1); x.lineTo(x1 - 16 * Math.cos(a - 0.45), y1 - 16 * Math.sin(a - 0.45)); x.lineTo(x1 - 16 * Math.cos(a + 0.45), y1 - 16 * Math.sin(a + 0.45)); x.closePath(); x.fill();
      } else { s.pts.forEach(([px, py], k) => (k ? x.lineTo(px, py) : x.moveTo(px, py))); x.stroke(); }
    });
  }

  /* ═════ 25. Smart Reframe ═════ */
  const ASPECT = { "9:16": 9 / 16, "1:1": 1, "4:5": 4 / 5 };
  D.reframe = {
    abLabels: ["Голоос тайрсан", "Smart Reframe"],
    controls: [SEL("ar", "Шинэ харьцаа", [["9:16", "9:16 — босоо"], ["1:1", "1:1 — дөрвөлжин"], ["4:5", "4:5"]], "9:16"),
               SEL("mode", "Object of Interest", [["auto", "Auto"], ["ref", "Reference Point"]], "auto"),
               R("rx", "Reference Point · X", 0, W, 1, 150)],
    init(stage, S) {
      stage.appendChild(img(S.src, "ez-dim"));
      const win = el("div", { class: "ez-win" }, [img(S.src)]); stage.appendChild(win);
      const lab = el("span", { class: "ez-tag" }); stage.appendChild(lab);
      const dot = el("div", { class: "ez-ref" }); stage.appendChild(dot);
      return { win, lab, dot };
    },
    update(v, before, st, ctl) {
      ctl.disable("rx", v.mode !== "ref");
      const w = H * ASPECT[v.ar];
      const cx = before ? W / 2 : v.mode === "auto" ? P.x : v.rx;
      const x0 = Math.max(0, Math.min(W - w, cx - w / 2));
      Object.assign(st.win.style, { left: pctX(x0), width: pctX(w) });
      const inner = st.win.firstChild; Object.assign(inner.style, { width: (W / w * 100) + "%", left: (-x0 / w * 100) + "%" });
      const cut = P.x + P.r * 0.6 > x0 + w || P.x - P.r * 0.6 < x0;
      st.lab.textContent = (before ? "Голоос тайрсан " : "Smart Reframe ") + v.ar + (cut ? " — гариг таслагдав" : " — гариг хүрээнд");
      Object.assign(st.dot.style, { left: pctX(v.rx), top: "50%" });
      st.dot.hidden = before || v.mode !== "ref";
    }
  };

  /* ═════ 26. Jog Wheel ═════ */
  D.jog = {
    noAB: true,
    controls: [R("f", "● -г чирэх (кадар)", -24, 24, 1, 0, "", (n) => (n > 0 ? "+" : "") + n)],
    init(stage, S) {
      stage.classList.add("ez-black");
      const i = img(S.src); stage.appendChild(i);
      const tc = el("span", { class: "ez-tc" }); stage.appendChild(tc);
      const jw = el("div", { class: "ez-jw" }, [el("span", { text: "‹" }), el("i"), el("span", { text: "›" })]); stage.appendChild(jw);
      return { i, tc, jw };
    },
    update(v, before, st) {
      const base = 1 * FPS + 16, f = base + v.f;
      const tc = "01:00:" + String(Math.floor(f / FPS)).padStart(2, "0") + ":" + String(((f % FPS) + FPS) % FPS).padStart(2, "0");
      st.tc.textContent = tc;
      st.i.style.transform = "scale(1.08) translateX(" + (-v.f * 0.12) + "%)";
      st.jw.querySelector("i").style.transform = "translateX(" + v.f * 0.9 + "px)";
    }
  };
})(window.RM);

</script>
<script>

      ])))

  function build() {
    const S = G.build();

      root: document.getElementById("fz"),
