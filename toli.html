<!DOCTYPE html>
<html lang="mn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>1st Studio — Толь (Blender ба камерын нэр томъёо)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* ═══════════════════════════════════════════════════════════════════════
   BLENDER 5.2 DEFAULT DARK — camera.html-тэй ЯГ ижил палитр
   Эх сурвалж: blender/blender @ blender-v5.2-release
   release/datafiles/userdef/userdef_default_theme.c
   (Толийн гурван баганын загвар нь toli-ui.js дотор)
   ═══════════════════════════════════════════════════════════════════════ */
:root{
  --win:#161616; --topbar:#181818; --editor:#303030; --view:#3d3d3d;
  --outliner:#282828; --region:#1d1d1d;
  --rim:rgba(255,255,255,.082); --rim-act:rgba(255,255,255,.165);
  --wid:#545454; --wid-h:#636363; --wid-in:#1d1d1d; --wid-in-f:#181818; --wid-out:#3d3d3d;
  --toolbar:#282828; --emboss:rgba(0,0,0,.149);
  --txt:#e6e6e6; --txt-hi:#ffffff; --txt-title:#eeeeee;
  --dim:#c3c3c3; --dim2:#a6a6a6; --mute:#838383; --mute2:#888888; --link:#6fa9e6;
  --menu:#181818; --menu-out:#242424; --menu-txt:#dddddd; --menu-hov:rgba(255,255,255,.1); --tip:#1d1d1d;
  --panel:#3d3d3d; --panel-hdr:#3d3d3d; --panel-out:rgba(255,255,255,.067); --panel-sub:rgba(0,0,0,.122);
  --acc:#4772b3; --acc-h:#5681c2;
  --sel:#ed5700; --act:#ffa028; --ol-sel:#e96a00; --ol-act:#ffaf29;
  --ol-act-bg:#334d80; --ol-sel-bg:#1d314d; --ol-alt:rgba(255,255,255,.016);
  --key:#bfbfbf; --key-sel:#ffbe33;
  --x:#ff3352; --y:#8bdc00; --z:#2890ff;
  --err:#991616; --warn:#ac8737; --info:#28487d; --ok:#188625;
  --err-t:#e98a8a; --warn-t:#e8c98a; --ok-t:#8fd39a;
  --r-wid:4px; --r-panel:8px; --r-editor:6px; --gap:2px;
  --shadow:0 2px 12px rgba(0,0,0,.34);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden}
body{background:var(--win);color:var(--txt);font-family:'Inter',system-ui,-apple-system,sans-serif;
  font-size:12px;line-height:1.45;-webkit-font-smoothing:antialiased}
a{color:var(--link);text-decoration:none}
a:hover{text-decoration:underline}
::selection{background:var(--acc);color:#fff}
::-webkit-scrollbar{width:11px;height:11px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--wid);border-radius:6px;border:3px solid transparent;background-clip:padding-box}
::-webkit-scrollbar-thumb:hover{background:var(--wid-h);background-clip:padding-box;border:3px solid transparent}
*{scrollbar-width:thin;scrollbar-color:var(--wid) transparent}
:focus-visible{outline:1px solid var(--acc);outline-offset:1px}

#root{display:flex;flex-direction:column;height:100%}
#pbar{height:30px;flex:none;display:flex;align-items:center;gap:10px;padding:0 10px;background:var(--topbar)}
.logo{font-weight:600;font-size:12.5px;letter-spacing:.5px;white-space:nowrap;color:var(--txt-title)}
.logo b{color:var(--act)}
.logo span{color:var(--mute);font-weight:400}
.sp{flex:1}
#pbar .lnk{font-size:11px;color:var(--dim);padding:4px 8px;border-radius:var(--r-wid)}
#pbar .lnk:hover{background:var(--menu-hov);color:var(--txt-hi);text-decoration:none}
#host{flex:1;min-height:0}
#sbar{height:26px;flex:none;display:flex;align-items:center;gap:14px;padding:0 10px;background:var(--topbar);
  font-size:10px;color:var(--mute2);white-space:nowrap;overflow:hidden}
#sbar b{color:var(--txt);font-weight:400}
#sbar .k{font-family:'JetBrains Mono',monospace;background:var(--wid);border-radius:3px;padding:0 4px;color:var(--txt)}
</style>
</head>
<body>
<div id="root">

  <div id="pbar">
    <div class="logo">1<b>st</b> STUDIO <span>· Толь</span></div>
    <div class="sp"></div>
    <a class="lnk" href="camera.html">🎥 Camera Director</a>
  </div>

  <div id="host"></div>

  <div id="sbar">
    <span><b id="sTotal">0</b> үг · <b id="sCats">0</b> ангилал</span>
    <span class="sp" style="flex:1"></span>
    <span><span class="k">/</span> хайх · <span class="k">↑</span><span class="k">↓</span> үг солих ·
          <span class="k">R</span> санамсаргүй · <span class="k">←</span> буцах · <span class="k">Esc</span> цэвэрлэх</span>
  </div>
</div>

<script src="toli-data.js"></script>
<script src="toli-ui.js"></script>
<script>
const toli = toliMount(document.getElementById('host'), {});
document.getElementById('sTotal').textContent = toli.count;
document.getElementById('sCats').textContent = (typeof TOLI !== 'undefined' && TOLI.cats ? TOLI.cats.length : 0);

/* Хаягийн # хэсэг, эсвэл сүүлд үзсэн үгийг нээнэ */
const start = location.hash.slice(1);
if (start && toli.byId[start]) toli.open(start);
else if (toli.last()) toli.open(toli.last());

window.addEventListener('hashchange', () => {
  const id = location.hash.slice(1);
  if (id && toli.byId[id]) toli.open(id);
});
document.addEventListener('keydown', e => { toli.onKey(e); });
console.log('%c1st Studio — Толь', 'color:#ffa028;font-weight:700', toli.count + ' үг');
</script>
</body>
</html>
