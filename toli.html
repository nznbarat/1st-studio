<!DOCTYPE html>
<html lang="mn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>1st Studio — Толь (Blender ба камерын нэр томъёо)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* ═══════════════════════════════════════════════════════════════════════
   BLENDER 5.2 DEFAULT DARK — camera.html-тэй ЯГ ижил палитр
   Эх сурвалж: blender/blender @ blender-v5.2-release
   release/datafiles/userdef/userdef_default_theme.c
   ═══════════════════════════════════════════════════════════════════════ */
:root{
  --win:#161616; --topbar:#181818; --editor:#303030; --view:#3d3d3d;
  --outliner:#282828; --region:#1d1d1d;
  --rim:rgba(255,255,255,.082); --rim-act:rgba(255,255,255,.165);
  --wid:#545454; --wid-h:#636363; --wid-in:#1d1d1d; --wid-in-f:#181818; --wid-out:#3d3d3d;
  --toolbar:#282828; --emboss:rgba(0,0,0,.149);
  --txt:#e6e6e6; --txt-hi:#ffffff; --txt-title:#eeeeee;
  --dim:#c3c3c3; --dim2:#a6a6a6; --mute:#838383; --mute2:#888888; --link:#6fa9e6;
  --menu:#181818; --menu-out:#242424; --menu-txt:#dddddd; --menu-hov:rgba(255,255,255,.1); --tip:#1d1d1d;
  --panel:#3d3d3d; --panel-hdr:#3d3d3d; --panel-out:rgba(255,255,255,.067); --panel-sub:rgba(0,0,0,.122);
  --acc:#4772b3; --acc-h:#5681c2;
  --sel:#ed5700; --act:#ffa028; --ol-sel:#e96a00; --ol-act:#ffaf29;
  --ol-act-bg:#334d80; --ol-sel-bg:#1d314d; --ol-alt:rgba(255,255,255,.016);
  --key:#bfbfbf; --key-sel:#ffbe33;
  --x:#ff3352; --y:#8bdc00; --z:#2890ff;
  --err:#991616; --warn:#ac8737; --info:#28487d; --ok:#188625;
  --err-t:#e98a8a; --warn-t:#e8c98a; --ok-t:#8fd39a;
  --r-wid:4px; --r-panel:8px; --r-editor:6px; --gap:2px;
  --shadow:0 2px 12px rgba(0,0,0,.34);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden}
body{background:var(--win);color:var(--txt);font-family:'Inter',system-ui,-apple-system,sans-serif;
  font-size:12px;line-height:1.45;-webkit-font-smoothing:antialiased}
button{cursor:pointer;border:none;background:none;font-family:inherit;color:inherit}
input{font-family:inherit;color:inherit}
a{color:var(--link);text-decoration:none}
a:hover{text-decoration:underline}
.mono{font-family:'JetBrains Mono',ui-monospace,monospace}
::selection{background:var(--acc);color:#fff}
::-webkit-scrollbar{width:11px;height:11px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--wid);border-radius:6px;border:3px solid transparent;background-clip:padding-box}
::-webkit-scrollbar-thumb:hover{background:var(--wid-h);background-clip:padding-box;border:3px solid transparent}
*{scrollbar-width:thin;scrollbar-color:var(--wid) transparent}
:focus-visible{outline:1px solid var(--acc);outline-offset:1px}

.w{background:var(--wid);border:none;border-radius:var(--r-wid);padding:5px 9px;font-size:11.5px;
   color:var(--txt);box-shadow:inset 0 -1px 0 var(--emboss);transition:background .08s}
.w:hover{background:var(--wid-h)}
.w.on{background:var(--acc);color:var(--txt-hi)}

/* ═══ Байрлал ═══ */
#root{display:flex;flex-direction:column;height:100%;background:var(--win)}
#topbar{height:30px;flex:none;display:flex;align-items:center;gap:8px;padding:0 8px;background:var(--topbar)}
.logo{font-weight:600;font-size:12.5px;letter-spacing:.5px;white-space:nowrap;color:var(--txt-title)}
.logo b{color:var(--act)}
.logo span{color:var(--mute);font-weight:400}
.spacer{flex:1}
#q{width:340px;max-width:42vw;background:var(--wid-in);border:1px solid var(--wid-out);border-radius:var(--r-wid);
   padding:4px 9px;font-size:11.5px}
#q:focus{border-color:var(--acc);background:var(--wid-in-f);outline:none}
#topbar .lnk{font-size:11px;color:var(--dim);padding:4px 8px;border-radius:var(--r-wid)}
#topbar .lnk:hover{background:var(--menu-hov);color:var(--txt-hi);text-decoration:none}

#main{flex:1;display:flex;min-height:0;gap:var(--gap);padding:var(--gap) var(--gap) 0}
.area{border-radius:var(--r-editor);overflow:hidden;box-shadow:0 0 0 1px var(--rim);display:flex;flex-direction:column;min-height:0}
.ehdr{height:24px;flex:none;display:flex;align-items:center;gap:6px;padding:0 8px;font-size:10px;
  text-transform:uppercase;letter-spacing:.09em;color:var(--txt-title);font-weight:500}
.ehdr .n{color:var(--mute);font-family:'JetBrains Mono';font-size:9.5px;text-transform:none}

/* ── Ангилал (Outliner) ── */
#cats{width:236px;flex:none;background:var(--outliner)}
#cats .ehdr{background:var(--outliner)}
#ctree{flex:1;overflow:auto;padding:2px 0}
.crow{display:flex;align-items:center;gap:7px;padding:4px 10px;cursor:pointer;white-space:nowrap;color:var(--dim);font-size:11.5px}
.crow:nth-child(even){background:var(--ol-alt)}
.crow:hover{background:rgba(255,255,255,.05)}
.crow.on{background:var(--ol-act-bg);color:var(--ol-act);font-weight:500}
.crow .ic{width:16px;text-align:center;flex:none;filter:saturate(.5)}
.crow .nm{flex:1;overflow:hidden;text-overflow:ellipsis}
.crow .n{font-family:'JetBrains Mono';font-size:9.5px;color:var(--mute)}
.crow.on .n{color:#ffd79a}

/* ── Үгсийн жагсаалт ── */
#list{width:280px;flex:none;background:var(--region)}
#list .ehdr{background:var(--region)}
#lrows{flex:1;overflow:auto;padding:2px 0}
.lrow{display:flex;flex-direction:column;gap:1px;padding:5px 10px;cursor:pointer;border-left:2px solid transparent}
.lrow:nth-child(even){background:var(--ol-alt)}
.lrow:hover{background:rgba(255,255,255,.05)}
.lrow.on{background:var(--acc);border-left-color:var(--act)}
.lrow .m{font-size:12px;color:var(--txt);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lrow.on .m{color:#fff;font-weight:500}
.lrow .e{font-size:10px;color:var(--mute);font-family:'JetBrains Mono';overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lrow.on .e{color:#cddcf2}
.lrow .c{font-size:9px;color:var(--mute);text-transform:uppercase;letter-spacing:.06em}
.lrow.on .c{color:#cddcf2}
.empty{padding:14px 12px;color:var(--mute);font-size:11px;line-height:1.6}

/* ── Дэлгэрэнгүй тайлбар ── */
#det{flex:1;min-width:0;background:var(--editor)}
#dhdr{height:24px;flex:none;display:flex;align-items:center;gap:8px;padding:0 10px;background:var(--editor)}
#dbody{flex:1;overflow-y:auto;padding:14px 18px 50px;user-select:text}
#dbody.center{display:flex;align-items:center;justify-content:center;text-align:center}
.wel{max-width:560px;color:var(--dim2);font-size:12.5px;line-height:1.8}
.wel h2{font-size:19px;color:var(--txt-hi);margin-bottom:10px;font-weight:700}
.wel b{color:var(--txt)}
.title{display:flex;align-items:flex-end;gap:10px;flex-wrap:wrap;margin-bottom:3px}
.title h1{font-size:23px;font-weight:700;color:var(--txt-hi);line-height:1.2}
.title .en{font-size:14px;color:var(--act);font-family:'JetBrains Mono';padding-bottom:3px}
.subline{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px;padding-bottom:11px;border-bottom:1px solid var(--rim)}
.tag{font-size:10px;padding:2px 8px;border-radius:10px;background:var(--panel-sub);border:1px solid var(--rim);color:var(--dim2)}
.tag.cat{border-color:rgba(71,114,179,.5);background:rgba(71,114,179,.16);color:#9dbdec}
.tag.alt{color:var(--dim)}
.kbd{font-family:'JetBrains Mono';font-size:11px;background:var(--wid);border:1px solid var(--wid-out);
  border-bottom-width:2px;border-radius:3px;padding:1px 6px;color:var(--txt-hi)}
.short{font-size:14px;line-height:1.7;color:var(--txt-hi);margin-bottom:14px}
.box{background:var(--panel);border:1px solid var(--panel-out);border-radius:var(--r-panel);overflow:hidden;margin-bottom:9px}
.box>h3{display:flex;align-items:center;gap:7px;padding:6px 10px;background:var(--panel-hdr);font-size:10.5px;
  font-weight:600;text-transform:uppercase;letter-spacing:.07em;color:var(--txt);cursor:pointer}
.box>h3::before{content:"▼";font-size:7px;color:var(--dim2);transition:transform .15s}
.box.fold>h3::before{transform:rotate(-90deg)}
.box.fold>.bd{display:none}
.box .bd{padding:11px 13px;background:var(--panel-sub)}
.box p{font-size:12.5px;line-height:1.8;color:var(--txt);margin-bottom:10px;max-width:80ch}
.box p:last-child{margin-bottom:0}
.box b{color:var(--txt-hi)}
.box .mono{font-size:11.5px;color:var(--dim)}
.cmd{display:flex;gap:10px;align-items:baseline;font-size:12.5px;margin-bottom:7px;flex-wrap:wrap}
.cmd:last-child{margin-bottom:0}
.cmd .lb{width:96px;flex:none;color:var(--dim2);font-size:11px;text-align:right}
.cmd .vl{flex:1;min-width:0;color:var(--txt)}
.exbox{background:rgba(71,114,179,.13);border-left:2px solid var(--acc)}
.warnbox{background:rgba(172,135,55,.12);border-left:2px solid var(--warn)}
.stbox{background:rgba(24,134,37,.10);border-left:2px solid var(--ok)}
.rel{display:flex;flex-wrap:wrap;gap:5px}
.rel button{background:var(--wid-in);border:1px solid var(--wid-out);border-radius:11px;padding:3px 10px;
  font-size:11px;color:var(--dim)}
.rel button:hover{border-color:var(--acc);color:var(--txt-hi)}
mark{background:var(--act);color:#1a1206;border-radius:2px;padding:0 2px}

#sbar{height:26px;flex:none;display:flex;align-items:center;gap:14px;padding:0 10px;background:var(--topbar);
  font-size:10px;color:var(--mute2);white-space:nowrap;overflow:hidden}
#sbar b{color:var(--txt);font-weight:400}
#sbar .k{font-family:'JetBrains Mono';background:var(--wid);border-radius:3px;padding:0 4px;color:var(--txt)}

@media (max-width:1100px){#cats{width:190px}#list{width:230px}}
@media (max-width:820px){
  #main{flex-direction:column}
  #cats{width:100%;height:112px;flex:none}
  #list{width:100%;height:150px;flex:none}
  #det{flex:1}
  #q{width:180px}
}
</style>
</head>
<body>
<div id="root">

<div id="topbar">
  <div class="logo">1<b>st</b> STUDIO <span>· Толь</span></div>
  <input id="q" placeholder="Хайх…  (Монгол, англи аль нь ч болно)" autocomplete="off" spellcheck="false">
  <span id="qn" class="mono" style="font-size:10px;color:var(--mute)"></span>
  <div class="spacer"></div>
  <a class="lnk" href="camera.html">🎥 Camera Director</a>
  <a class="lnk" href="camera.html#manual" title="Camera Director дотор F1 товчоор нээгдэнэ">📖 Гарын авлага</a>
</div>

<div id="main">
  <div id="cats" class="area">
    <div class="ehdr">⌗ Ангилал <span class="spacer"></span><span class="n" id="catN"></span></div>
    <div id="ctree"></div>
  </div>

  <div id="list" class="area">
    <div class="ehdr">☰ Үгс <span class="spacer"></span><span class="n" id="listN"></span></div>
    <div id="lrows"></div>
  </div>

  <div id="det" class="area">
    <div id="dhdr"><span class="ehdr" style="padding:0">📖 Тайлбар</span><span class="spacer"></span>
      <span class="n mono" id="detN" style="font-size:9.5px;color:var(--mute)"></span></div>
    <div id="dbody" class="center"></div>
  </div>
</div>

<div id="sbar">
  <span><b id="sTotal">0</b> үг · <b id="sCats">0</b> ангилал</span>
  <span class="spacer" style="flex:1"></span>
  <span><span class="k">/</span> хайх · <span class="k">↑</span><span class="k">↓</span> үг солих ·
        <span class="k">Esc</span> цэвэрлэх · <span class="k">←</span> буцах</span>
</div>
</div>

<script src="toli-data.js"></script>
<script>
/* ══════════════════════════════════════════════════════════════════════
   Толь — Blender 5.2 маягийн гурван баганат үзүүлэгч
   Өгөгдөл: toli-data.js  →  const TOLI = { cats:[...], entries:[...] }
   ══════════════════════════════════════════════════════════════════════ */
const $ = id => document.getElementById(id);
const DATA = (typeof TOLI !== 'undefined' && TOLI) ? TOLI : { cats: [], entries: [] };
const CATS = DATA.cats || [];
const ALL = (DATA.entries || []).slice();
const byId = {};
ALL.forEach(e => { byId[e.id] = e; });
const catOf = id => CATS.find(c => c.id === id) || { id: id, mn: id, ico: '•' };

let curCat = 'all', curId = null, query = '', hist = [];

const esc = t => String(t == null ? '' : t)
  .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
const hasText = v => typeof v === 'string' && v.trim().length > 0;

function hay(e) {
  return (e._h || (e._h = [e.mn, e.en, e.alt, e.short, e.deep, e.use, e.ex, e.blender, e.keys, e.studio]
    .filter(hasText).join(' ').toLowerCase()));
}
function matches(e) {
  if (query && hay(e).indexOf(query) < 0) return false;
  if (curCat !== 'all' && e.cat !== curCat) return false;
  return true;
}
function hi(text) {
  const t = esc(text);
  if (!query) return t;
  const rx = new RegExp('(' + query.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + ')', 'ig');
  return t.replace(rx, '<mark>$1</mark>');
}

/* ── Ангиллын багана ── */
function drawCats() {
  const counts = {};
  ALL.forEach(e => { if (!query || hay(e).indexOf(query) >= 0) counts[e.cat] = (counts[e.cat] || 0) + 1; });
  const total = Object.keys(counts).reduce((s, k) => s + counts[k], 0);
  let h = '<div class="crow' + (curCat === 'all' ? ' on' : '') + '" data-cat="all">' +
    '<span class="ic">🗀</span><span class="nm">Бүх үг</span><span class="n">' + total + '</span></div>';
  CATS.forEach(c => {
    const n = counts[c.id] || 0;
    h += '<div class="crow' + (curCat === c.id ? ' on' : '') + '" data-cat="' + c.id + '"' +
      (n ? '' : ' style="opacity:.45"') + '>' +
      '<span class="ic">' + (c.ico || '•') + '</span><span class="nm">' + esc(c.mn) + '</span>' +
      '<span class="n">' + n + '</span></div>';
  });
  $('ctree').innerHTML = h;
  $('catN').textContent = CATS.length + ' ангилал';
}

/* ── Үгсийн жагсаалт ── */
function drawList() {
  const rows = ALL.filter(matches).sort((a, b) => (a.mn || '').localeCompare(b.mn || '', 'mn'));
  $('lrows').innerHTML = rows.length ? rows.map(e =>
    '<div class="lrow' + (e.id === curId ? ' on' : '') + '" data-id="' + e.id + '">' +
    '<span class="m">' + hi(e.mn) + '</span>' +
    '<span class="e">' + hi(e.en || '') + '</span>' +
    (curCat === 'all' ? '<span class="c">' + esc(catOf(e.cat).mn) + '</span>' : '') +
    '</div>').join('')
    : '<div class="empty">Илэрц алга.<br>Өөр үгээр хайж үзнэ үү, эсвэл зүүн талаас <b>«Бүх үг»</b> сонгоно уу.</div>';
  $('listN').textContent = rows.length + ' үг';
  $('qn').textContent = query ? rows.length + ' илэрц' : '';
  return rows;
}

/* ── Дэлгэрэнгүй тайлбар ── */
function paras(txt) {
  return String(txt || '').split(/\n{2,}|\n/).map(p => p.trim()).filter(Boolean)
    .map(p => '<p>' + hi(p) + '</p>').join('');
}
function box(title, inner, cls, folded) {
  if (!inner) return '';
  return '<div class="box' + (folded ? ' fold' : '') + '"><h3>' + title + '</h3>' +
    '<div class="bd' + (cls ? ' ' + cls : '') + '">' + inner + '</div></div>';
}
function drawDetail() {
  const b = $('dbody');
  const e = curId ? byId[curId] : null;
  if (!e) {
    b.classList.add('center');
    b.innerHTML = '<div class="wel"><h2>📖 Толь</h2>' +
      '<p>Blender 5.2, кино камер, гэрэлтүүлэг, анимаци ба AI видеоны нэр томъёог <b>монголоор</b>, ' +
      'гүнзгий тайлбартайгаар цуглуулсан лавлах.</p>' +
      '<p>Зүүн талаас <b>ангиллаа</b> сонгоод, дунд баганаас <b>үг дээрээ дарна</b> — ' +
      'энд түүний утга, тайлал, Blender дээрх команд, хэрэглэх жишээ бүгд гарч ирнэ.</p>' +
      '<p style="color:var(--mute)">Дээд талын хайлтад монгол, англи аль ч үгээр хайж болно. ' +
      '<span class="kbd">/</span> дарвал шууд хайлт руу шилжинэ.</p></div>';
    $('detN').textContent = '';
    return;
  }
  b.classList.remove('center');
  const c = catOf(e.cat);
  let h = '<div class="title"><h1>' + hi(e.mn) + '</h1>' +
    (hasText(e.en) ? '<span class="en">' + hi(e.en) + '</span>' : '') + '</div>';

  h += '<div class="subline"><span class="tag cat">' + (c.ico || '•') + ' ' + esc(c.mn) + '</span>';
  if (hasText(e.alt)) h += '<span class="tag alt">бас: ' + esc(e.alt) + '</span>';
  if (hasText(e.keys)) h += '<span class="kbd">' + esc(e.keys) + '</span>';
  h += '</div>';

  if (hasText(e.short)) h += '<div class="short">' + hi(e.short) + '</div>';

  h += box('📘 Гүнзгий тайлбар', paras(e.deep));

  let cmd = '';
  if (hasText(e.blender)) cmd += '<div class="cmd"><span class="lb">Blender дээр</span><span class="vl">' + hi(e.blender) + '</span></div>';
  if (hasText(e.keys)) cmd += '<div class="cmd"><span class="lb">Товчлуур</span><span class="vl"><span class="kbd">' + esc(e.keys) + '</span></span></div>';
  if (hasText(e.en)) cmd += '<div class="cmd"><span class="lb">Англиар</span><span class="vl mono">' + esc(e.en) + '</span></div>';
  h += box('⌨ Команд ба нэр', cmd);

  h += box('🎯 Хэзээ хэрэглэх', paras(e.use));
  h += box('💡 Жишээ', paras(e.ex), 'exbox');
  if (hasText(e.warn)) h += box('⚠ Анхаарах', paras(e.warn), 'warnbox');
  if (hasText(e.studio)) h += box('🎥 Энэ програм дээр хаана байна', paras(e.studio), 'stbox');

  const rel = (e.rel || []).filter(id => byId[id]);
  if (rel.length) {
    h += box('🔗 Холбоотой үгс', '<div class="rel">' + rel.map(id =>
      '<button data-go="' + id + '">' + esc(byId[id].mn) + '</button>').join('') + '</div>');
  }
  b.innerHTML = h;
  b.scrollTop = 0;
  $('detN').textContent = e.id;
}

/* ── Удирдлага ── */
function select(id, push) {
  if (!byId[id]) return;
  if (push !== false && curId && curId !== id) hist.push(curId);
  curId = id;
  try { localStorage.setItem('1stStudio.toli.last', id); } catch (err) { }
  if (location.hash.slice(1) !== id) history.replaceState(null, '', '#' + id);
  drawList(); drawDetail();
  const el = document.querySelector('.lrow.on');
  if (el) el.scrollIntoView({ block: 'nearest' });
}
function step(d) {
  const rows = ALL.filter(matches).sort((a, b) => (a.mn || '').localeCompare(b.mn || '', 'mn'));
  if (!rows.length) return;
  let i = rows.findIndex(x => x.id === curId);
  i = i < 0 ? 0 : Math.min(rows.length - 1, Math.max(0, i + d));
  select(rows[i].id);
}
document.addEventListener('click', ev => {
  const c = ev.target.closest('[data-cat]');
  if (c) { curCat = c.dataset.cat; drawCats(); drawList(); return; }
  const r = ev.target.closest('[data-id]');
  if (r) { select(r.dataset.id); return; }
  const g = ev.target.closest('[data-go]');
  if (g) { const e = byId[g.dataset.go]; if (e) { curCat = 'all'; drawCats(); select(e.id); } return; }
  const h3 = ev.target.closest('.box>h3');
  if (h3) h3.parentElement.classList.toggle('fold');
});
$('q').addEventListener('input', () => {
  query = $('q').value.trim().toLowerCase();
  drawCats(); drawList();
});
document.addEventListener('keydown', ev => {
  const inQ = document.activeElement === $('q');
  if (ev.key === 'Escape') { if (inQ) { $('q').value = ''; query = ''; drawCats(); drawList(); $('q').blur(); } return; }
  if (ev.key === '/' && !inQ) { ev.preventDefault(); $('q').focus(); $('q').select(); return; }
  if (inQ && (ev.key === 'ArrowDown' || ev.key === 'Enter')) { ev.preventDefault(); $('q').blur(); step(ev.key === 'Enter' ? 0 : 1); return; }
  if (inQ) return;
  if (ev.key === 'ArrowDown') { ev.preventDefault(); step(1); }
  else if (ev.key === 'ArrowUp') { ev.preventDefault(); step(-1); }
  else if (ev.key === 'ArrowLeft' || (ev.key === 'Backspace')) {
    const p = hist.pop(); if (p) { ev.preventDefault(); select(p, false); }
  }
});
window.addEventListener('hashchange', () => {
  const id = location.hash.slice(1);
  if (id && byId[id] && id !== curId) select(id, false);
});

/* ── Эхлүүлэх ── */
$('sTotal').textContent = ALL.length;
$('sCats').textContent = CATS.length;
drawCats(); drawList();
let start = location.hash.slice(1);
if (!byId[start]) { try { start = localStorage.getItem('1stStudio.toli.last'); } catch (e) { start = null; } }
if (byId[start]) select(start, false); else drawDetail();
if (!ALL.length) {
  $('dbody').innerHTML = '<div class="wel"><h2>Толийн өгөгдөл олдсонгүй</h2>' +
    '<p><b>toli-data.js</b> файл энэ файлын хажууд байх ёстой. Хамт хуулж тавина уу.</p></div>';
}
console.log('%c1st Studio — Толь', 'color:#ffa028;font-weight:700', ALL.length + ' үг, ' + CATS.length + ' ангилал');
